<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>股娃娃</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="股娃娃">
<meta name="theme-color" content="#EEF0F6">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #EEF0F6; --surface: #FFFFFF; --surface-2: #F3F4F9; --edge: #CDD2E2;
  --text: #1B1E3C; --text2: #4A4F6E; --muted: #8A8FA8; --grid: #E3E6EF; --axis: #C3C8D8; --border: #DFE2EC;
  --ink: #1B1E3C; --mint: #3CCBAA; --mint-d: #23977E; --gold: #FFC94A;
  --accent: #1B1E3C; --accent-soft: #DDE1EE;
  --hero: #1B1E3C; --hero-dot: rgba(255,255,255,.10); --hero-edge: #0B0D20;
  --red: #E5484D; --green: #1F9D63;
  --t1: #2a78d6; --t2: #eb6834; --t3: #1baf7a; --t4: #eda100; --t5: #e87ba4;
  --radius: 16px;
  --num: "Jersey 10", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0E1124; --surface: #171B36; --surface-2: #1E2346; --edge: #070917;
    --text: #EEF0FA; --text2: #B9BDD6; --muted: #7D82A3; --grid: #252A4E; --axis: #333A68; --border: #272C52;
    --ink: #EEF0FA; --accent: #EEF0FA; --accent-soft: #2A3060;
    --hero: #0A0C1C; --hero-dot: rgba(255,255,255,.07); --hero-edge: #2A3060;
    --red: #FF6B6E; --green: #3FCB86;
    --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500; --t5: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0E1124; --surface: #171B36; --surface-2: #1E2346; --edge: #070917;
  --text: #EEF0FA; --text2: #B9BDD6; --muted: #7D82A3; --grid: #252A4E; --axis: #333A68; --border: #272C52;
  --ink: #EEF0FA; --accent: #EEF0FA; --accent-soft: #2A3060;
  --hero: #0A0C1C; --hero-dot: rgba(255,255,255,.07); --hero-edge: #2A3060;
  --red: #FF6B6E; --green: #3FCB86;
  --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500; --t5: #d55181;
}
:root { --up: var(--red); --down: var(--green); }
:root[data-updown="green"] { --up: var(--green); --down: var(--red); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.big-num { font-family: var(--num); letter-spacing: .02em; font-weight: 400; }
.muted { color: var(--muted); }
.sub { color: var(--text2); }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.px-corner, .block::before, .block > .face { clip-path: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)); }

/* ── 版面 ── */
.app { min-height: 100vh; }
.sidebar { display: none; }
main { max-width: 1120px; min-width: 0; margin: 0 auto; padding: 0 16px calc(104px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: calc(14px + env(safe-area-inset-top)) 0 10px; background: linear-gradient(var(--page) 72%, transparent); }
.topbar h1 { font-size: 24px; font-weight: 750; margin: 0; flex: 1; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.topbar h1 img { width: 33px; height: 31px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text2); }
.icon-btn:hover { background: var(--surface-2); }
.grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; border: 1.5px solid var(--border); box-shadow: 0 5px 0 var(--edge); min-width: 0; position: relative; }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.card-h h2 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; }
.card-h .hint { font-size: 13px; color: var(--muted); }

.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; align-items: center;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 2px solid var(--border); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); width: 64px; padding: 3px 0; position: relative; }
.tab.on { color: var(--text); font-weight: 700; }
.tab.on::after { content: ""; position: absolute; top: -10px; width: 18px; height: 4px; background: var(--mint); }
.tab-add { width: 52px; height: 52px; background: var(--ink); color: var(--page); display: grid; place-items: center; box-shadow: 4px 4px 0 var(--mint); transition: transform .08s, box-shadow .08s; }
.tab-add:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--mint); }
.tab-add svg.i { width: 26px; height: 26px; stroke-width: 2.4; }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 232px 1fr; }
  .sidebar { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 24px 14px; border-right: 2px solid var(--border); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; padding: 0 10px 20px; }
  .brand img { width: 44px; height: 42px; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: var(--text2); font-weight: 600; border: 2px solid transparent; }
  .nav:hover { background: var(--surface-2); }
  .nav.on { border-color: var(--ink); color: var(--text); box-shadow: 3px 3px 0 var(--mint); }
  .side-add { margin-top: 14px; justify-content: center; }
  main { padding: 8px 32px 48px; width: 100%; }
  .tabbar { display: none; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
  .span2 { grid-column: span 2; }
  .topbar h1 { font-size: 28px; }
}

/* ── 有厚度的總資產主卡 ── */
.block { position: relative; margin-bottom: 6px; }
.block::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; bottom: -6px; background: var(--hero-edge); }
.block > .face { position: relative; transition: transform .12s steps(2); }
.block.gw-pressed > .face { transform: translateY(5px); }
.hero { background: var(--hero); background-image: radial-gradient(var(--hero-dot) 1px, transparent 1.4px); background-size: 12px 12px; color: #fff; padding: 20px 22px 18px; }
.hero-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: rgba(255,255,255,.66); }
.hero-num { font-family: var(--num); font-size: clamp(54px, 15vw, 76px); line-height: 1; margin: 10px 0 14px; letter-spacing: .02em; }
.hero-num small { font-size: 18px; color: rgba(255,255,255,.6); margin-right: 6px; }
.hero .pill { background: rgba(255,255,255,.12); color: #fff; }
.hero .up, .hero .down, .hero .flat { color: #fff; }
.hero-meta { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,.55); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; font-size: 13px; font-weight: 650; background: var(--surface-2); white-space: nowrap; }
.pill .sep { opacity: .7; font-weight: 400; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.arrow { font-size: 10px; }

/* ── 今天＋股娃娃舞台 ── */
.today { padding: 0; overflow: hidden; }
.stage-wrap { position: relative; }
.stage { display: block; width: 100%; height: 150px; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; touch-action: pan-y; }
.today-body { padding: 14px 18px 16px; position: relative; }
.today-head { display: flex; align-items: baseline; gap: 10px; }
.today-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
.today-head span { font-size: 13px; color: var(--muted); }
.today-main { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 0; }
.today-amt { font-family: var(--num); font-size: clamp(48px, 13vw, 60px); line-height: 1; letter-spacing: .02em; }
.today-pct { font-family: var(--num); font-size: 26px; }
.today-msg { margin: 6px 0 0; font-weight: 650; }
.today-eq { margin: 0; font-size: 14px; color: var(--text2); }
.contrib { display: grid; gap: 9px; margin-top: 14px; padding-top: 14px; border-top: 1.5px dashed var(--border); }
.contrib-row { display: grid; grid-template-columns: 6.6em minmax(0, 1fr) 8.8em; gap: 10px; align-items: center; font-size: 13px; }
.contrib-row .nm { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contrib-row .amt { font-weight: 650; text-align: right; white-space: nowrap; }
.contrib-row .pend { grid-column: 2 / 4; text-align: right; font-size: 12px; color: var(--muted); }
.contrib-row .amt small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.cbar { position: relative; height: 8px; }
.cbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--border); }
.cbar i { position: absolute; top: 0; height: 8px; }
.today-foot { margin-top: 14px; font-size: 12px; color: var(--muted); }

/* ── 股娃娃：對話框、頁面層、漏雨、訪客 ── */
.gw-bubble { position: absolute; transform: translateY(-50%); background: #fff; color: #1B1E3C; font-size: 13px; font-weight: 700; padding: 3px 9px; border: 2px solid #1B1E3C; box-shadow: 3px 3px 0 #1B1E3C; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 2; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; }
.gw-bubble.on { opacity: 1; }
.gw-bubble::after { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -4px; width: 6px; height: 8px; background: #1B1E3C; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.gw-bubble.left { transform: translate(-100%, -50%); }
.gw-bubble.left::after { left: auto; right: -8px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.gw-page-bubble { position: fixed; z-index: 82; }
.gw-page { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 80; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.gw-puddle { position: absolute; width: 36px; height: 8px; background: #7FA7D6; opacity: .45; pointer-events: none; animation: gw-dry 25s steps(10) forwards;
  clip-path: polygon(4px 0, calc(100% - 8px) 0, calc(100% - 8px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px, 100% 6px, calc(100% - 4px) 6px, calc(100% - 4px) 100%, 6px 100%, 6px 6px, 0 6px, 0 2px, 4px 2px); }
@keyframes gw-dry { to { opacity: 0; } }
.mini { width: 44px; height: 42px; image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }
.mini.sm { width: 33px; height: 31px; }
.mini.bob { animation: gw-bob 1s steps(2) infinite; }
@keyframes gw-bob { 50% { transform: translateY(-2px); } }
.gw-visitor { position: fixed; z-index: 40; right: 0; bottom: calc(92px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; transform: translateX(110%); transition: transform .5s steps(6); pointer-events: none; }
.gw-visitor.on { transform: translateX(-6px); pointer-events: auto; }
.gw-visitor .gw-say { background: #fff; color: #1B1E3C; border: 2px solid #1B1E3C; box-shadow: 3px 3px 0 #1B1E3C; font-size: 13px; font-weight: 700; padding: 4px 10px; max-width: 220px; }
.gw-visitor img { width: 55px; height: 52px; image-rendering: pixelated; cursor: pointer; }
@media (min-width: 960px) { .gw-visitor { bottom: 24px; } }
.peek { display: flex; align-items: center; gap: 10px; margin: -4px 0 14px; }
.peek .gw-say { position: relative; background: var(--surface); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font-size: 13px; font-weight: 650; padding: 5px 11px; }
.peek .gw-say::before { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -4px; width: 6px; height: 8px; background: var(--ink); clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.explain { width: 34px; height: 32px; display: grid; place-items: center; border: 2px solid transparent; }
.explain:hover { border-color: var(--border); }
.explain img { width: 28px; height: 27px; image-rendering: pixelated; }

/* ── 目標：像素進度條 ── */
.goal-top { display: flex; align-items: flex-end; gap: 14px; }
.goal-pct { font-family: var(--num); font-size: 52px; line-height: .9; }
.goal-pct small { font-size: 22px; }
.pxbar { margin: 14px 0 6px; position: relative; }
.pxbar .track { height: 16px; background: var(--surface-2); border: 2px solid var(--ink); position: relative; overflow: hidden; }
.pxbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, var(--mint) 0 10px, var(--mint-d) 10px 12px); }
.pxbar .mark { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--gold); }
.pxbar .mark-l { position: absolute; top: -22px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.kv { display: grid; gap: 8px; flex: 1; min-width: 0; margin-top: 12px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 650; text-align: right; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-size: 21px; font-weight: 700; }
.note-box { margin-top: 12px; padding: 12px 14px; background: var(--surface-2); border-left: 4px solid var(--mint); font-size: 13px; color: var(--text2); }

/* ── 圖表 ── */
.chart { position: relative; height: 220px; }
.chart.tall { height: 260px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 13px; color: var(--text2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; display: inline-block; flex: none; }
.seg { display: inline-flex; border: 2px solid var(--ink); background: var(--surface); }
.seg button { padding: 4px 10px; font-size: 13px; color: var(--text2); }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--page); font-weight: 700; }
.alloc { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
.donut { position: relative; height: 150px; }
.donut-c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.donut-c b { font-family: var(--num); font-size: 26px; font-weight: 400; display: block; line-height: 1; }
.donut-c span { font-size: 12px; color: var(--muted); }
.alloc-list { display: grid; gap: 10px; }
.alloc-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.alloc-row .p { color: var(--muted); font-size: 13px; min-width: 44px; text-align: right; }
.alloc-row .a { grid-column: 2 / 4; font-size: 13px; color: var(--text2); margin-top: -8px; }

/* ── 列表 ── */
.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1.5px dashed var(--border); text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
button.row:active { transform: translateY(1px); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; }
.row .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; }
.row .r .t { font-weight: 650; }
.row .s.up { color: var(--up); } .row .s.down { color: var(--down); }
.group-h { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; padding: 14px 4px 4px; display: flex; align-items: center; gap: 6px; }

.year-h { display: flex; align-items: center; gap: 10px; padding: 20px 4px 10px; }
.year-h b { font-family: var(--num); font-size: 34px; font-weight: 400; line-height: 1; }
.year-h .pill { margin-left: auto; }
.date-badge { width: 58px; flex: none; white-space: nowrap; text-align: center; background: var(--surface-2); border: 2px solid var(--border); padding: 4px 0; line-height: 1.1; }
.date-badge b { font-family: var(--num); font-size: 24px; font-weight: 400; display: block; }
.date-badge span { font-size: 10.5px; color: var(--muted); }
.tag { font-size: 11px; padding: 1px 7px; background: var(--surface-2); color: var(--text2); font-weight: 600; white-space: nowrap; border: 1.5px solid var(--border); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px; border-bottom: 2px solid var(--grid); white-space: nowrap; }
td { text-align: right; padding: 9px 6px; border-bottom: 1.5px dashed var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; margin: 0 -2px; }

/* ── 表單 ── */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; color: var(--text2); font-weight: 600; }
.input { width: 100%; padding: 10px 12px; border: 2px solid var(--border); background: var(--surface); outline: none; border-radius: 0; transition: border-color .1s, box-shadow .1s; }
.input:focus { border-color: var(--ink); box-shadow: 3px 3px 0 var(--mint); }
.input.err { border-color: var(--red); }
textarea.input { min-height: 96px; resize: vertical; }
.frow { display: grid; grid-template-columns: 1fr 140px; gap: 6px 12px; align-items: center; padding: 11px 0; border-top: 1.5px dashed var(--border); }
.frow:first-of-type { border-top: 0; }
.frow .name { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.frow .last { font-size: 12px; color: var(--muted); }
.frow .input { text-align: right; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.frow .cost-l { font-size: 12px; color: var(--muted); text-align: right; }
.frow .diff { font-size: 12px; text-align: right; grid-column: 2; margin-top: -2px; }
.frow .diff:empty { display: none; }
.frow.closed .name { color: var(--muted); }
.fgroup + .fgroup { margin-top: 6px; }
.savebar { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 10; margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px;
  background: var(--surface); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.savebar .tot { flex: 1; min-width: 0; }
.savebar .tot b { font-family: var(--num); font-size: 30px; font-weight: 400; display: block; line-height: 1; }
.savebar .tot span { font-size: 13px; }
@media (min-width: 960px) { .savebar { bottom: 16px; } .frow { grid-template-columns: 1fr 180px; } }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; font-weight: 700; background: var(--surface); color: var(--text); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--ink); color: var(--page); box-shadow: 4px 4px 0 var(--mint); }
.btn.primary:active { box-shadow: 2px 2px 0 var(--mint); }
.btn.danger { color: var(--red); border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
.link { color: var(--text); font-size: 14px; font-weight: 650; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--mint); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1.5px dashed var(--border); }
.switch-row:first-of-type { border-top: 0; }

/* ── 浮層 ── */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,28,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--surface); border-top: 3px solid var(--ink);
  padding: 10px 18px calc(24px + env(safe-area-inset-bottom)); transform: translateY(102%); transition: transform .26s steps(6); }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 4px; background: var(--border); margin: 0 auto 12px; }
.sheet-h { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.sheet-h h3 { font-size: 19px; margin: 0; flex: 1; }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 560px; border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); transform: translate(-50%, -46%); opacity: 0; pointer-events: none; transition: transform .2s steps(4), opacity .2s; padding-bottom: 24px; }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  .sheet .grab { display: none; }
}
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; padding: 9px 16px; display: flex; align-items: center; gap: 8px;
  background: var(--surface); color: var(--text); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font-size: 14px; font-weight: 650; transition: .2s steps(3); pointer-events: none; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast img { width: 33px; height: 31px; image-rendering: pixelated; }
.busy { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; background: rgba(10,12,28,.18); }
.busy.on { display: grid; }
.busy img { width: 77px; height: 73px; image-rendering: pixelated; animation: gw-run .3s steps(2) infinite; }
@keyframes gw-run { 50% { transform: translateY(-3px); } }
.skel { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.2s steps(8) infinite; border-radius: var(--radius); }
@keyframes sh { to { background-position: -200% 0; } }
.empty { text-align: center; padding: 24px 12px; color: var(--muted); display: grid; justify-items: center; gap: 8px; }


/* ── 狀態卡 ── */
.gw-status-h { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.gw-status-h img { width: 77px; height: 73px; image-rendering: pixelated; background: var(--surface-2); border: 2px solid var(--border); }
.gw-status-h b { font-size: 22px; display: block; }
.gw-status-h span { font-size: 13px; color: var(--muted); }
.meter { display: grid; grid-template-columns: 3.4em 1fr 2.4em; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
.meter .track { height: 12px; background: var(--surface-2); border: 2px solid var(--ink); position: relative; }
.meter .track i { position: absolute; left: 0; top: 0; bottom: 0; }
.gw-log { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--text2); }
.gw-log li { padding: 6px 0; border-top: 1.5px dashed var(--border); display: flex; gap: 8px; align-items: center; }
.gw-log li:first-child { border-top: 0; }
.gw-log i { width: 8px; height: 12px; flex: none; }

/* ── 資產來源 ── */
.src-year + .src-year { margin-top: 18px; padding-top: 16px; border-top: 1.5px dashed var(--border); }
.src-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.src-top b { font-family: var(--num); font-size: 26px; font-weight: 400; }
.src-sum { font-size: 13px; color: var(--text2); margin: 0 0 10px; }
.src-row { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 10px; align-items: center; font-size: 13px; margin-top: 7px; }

/* ═════ 全站像素化 ═════ */
.pi { width: 24px; height: 24px; image-rendering: pixelated; image-rendering: crisp-edges; flex: none; display: inline-block; vertical-align: middle; }

/* 資產配置：20 格血條 */

.hpbar { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; height: 26px; border: 2px solid var(--ink); padding: 2px; margin: 8px 0 16px; background: var(--surface-2); }

/* 紀錄：章節橫幅＋像素日曆 */
.year-h { background: var(--ink); color: var(--page); padding: 10px 14px; margin: 22px 0 12px; }
.year-h b { color: var(--page); }
.year-h .pill { background: rgba(255,255,255,.14); color: var(--page); }

.date-badge { width: 58px; padding: 0 0 4px; background: var(--surface); border: 2px solid var(--ink); }

.rec-total { font-family: var(--num); font-size: 27px; font-weight: 400 !important; line-height: 1.05; display: flex; align-items: center; gap: 4px; letter-spacing: .02em; }

/* 彈出視窗：復古視窗標題列 */

/* 一格一格的分段長條 */

.cbar i { height: 10px; -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px); mask-image: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px); }

/* 表格與數字 */
th { background: var(--surface-2); border-bottom: 2px solid var(--ink); color: var(--text2); }

.row .r .t.num { font-family: var(--num); font-size: 22px; font-weight: 400; letter-spacing: .02em; }

@keyframes gw-blink { 50% { opacity: .25; } }
/* 市場頁 */
.anchor { padding: 14px 16px; }
.anchor .gw-say { font-size: 14px; line-height: 1.5; }

.ind-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

.ind { padding: 12px 14px; text-align: left; display: grid; gap: 2px; }
button.ind:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge); }
.ind-n { font-size: 12px; color: var(--muted); font-weight: 600; }
.ind-v { font-family: var(--num); font-size: 30px; line-height: 1.05; letter-spacing: .02em; }
.ind-d { font-size: 12px; font-weight: 700; }
.spark { width: 100%; height: 30px; margin-top: 6px; }
/* 資料健康提醒 */
.health { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 14px; border: 2px solid var(--ink); box-shadow: 3px 3px 0 #FFC94A; border-radius: 0; font-size: 13px; font-weight: 650; color: var(--text); }

/* 資產配置甜甜圈 */
.alloc-wrap { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 18px; align-items: center; margin-top: 4px; }
.donut { position: relative; width: 136px; height: 136px; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font-family: var(--num); font-size: 30px; font-weight: 400; line-height: 1; }
.donut-c span { font-size: 11px; color: var(--muted); }
/* 新聞總覽：依小標分段 */
.ov { display: grid; gap: 16px; margin-top: 6px; }
.ov p { margin: 0; font-size: 14px; line-height: 1.75; color: var(--text2); }
.ov-h { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 750; color: var(--text); margin-bottom: 6px; }
.ov-quote { font-size: 17px; font-weight: 700; line-height: 1.6; color: var(--text); padding: 12px 14px; background: var(--surface-2); border-left: 4px solid var(--mint); }
.ov-temp { display: flex; gap: 10px; align-items: flex-start; }

.ov-chip.cool { background: color-mix(in srgb, var(--down) 18%, var(--surface)); }
.ov-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: ov; }
.ov-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; font-size: 14px; line-height: 1.75; color: var(--text2); }
.ov-list li::before { counter-increment: ov; content: counter(ov); font-family: var(--num); font-size: 17px; width: 22px; height: 22px; display: grid; place-items: center; background: var(--ink); color: var(--page); margin-top: 3px; }
.ov-list b, .ov p b { color: var(--text); }
.ov-watch { padding: 12px 14px; background: var(--surface-2); border: 2px solid var(--border); }
/* 存錢冒險（未來預測） */
.qmap { position: relative; height: 78px; margin: 4px 14px 6px; }
.qtrack { position: absolute; left: 0; right: 0; top: 46px; height: 4px; background: repeating-linear-gradient(90deg, var(--axis) 0 6px, transparent 6px 10px); }
.qtrack i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mint); }
.qnode { position: absolute; top: 30px; transform: translateX(-50%); text-align: center; }
.qnode img { width: 16px; height: 16px; display: block; margin: 0 auto; image-rendering: pixelated; }
.qnode span { display: block; font-size: 11px; font-weight: 750; margin-top: 8px; white-space: nowrap; color: var(--text2); }
.qme { position: absolute; top: 0; transform: translateX(-50%); }
.qme .mini { width: 34px; height: auto; }
.quests { display: grid; gap: 12px; margin-top: 8px; }
.q { border: 2px solid var(--ink); padding: 12px 14px; background: var(--surface); box-shadow: 3px 3px 0 var(--ink); }
.q-top { display: flex; align-items: baseline; gap: 8px; }
.q-top b { font-size: 15px; }
.q-amt { margin-left: auto; font-family: var(--num); font-size: 26px; line-height: 1; }
.q-sub { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.q-meter { height: 14px; background: var(--surface-2); border: 2px solid var(--ink); padding: 1px; }
.q-meter i { display: block; height: 100%; }
.q-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; margin-top: 8px; color: var(--text2); }
.q-foot b { color: var(--text); }
.q-stars { color: #E0A400; letter-spacing: 1px; white-space: nowrap; }
.q.done { box-shadow: 3px 3px 0 var(--mint); }
.q.done .q-meter i { background: var(--mint); }
.q-group { font-size: 13px; font-weight: 750; margin: 18px 0 2px; }
/* 紀錄：年份折疊 */
details.yr > summary { list-style: none; cursor: pointer; }
details.yr > summary::-webkit-details-marker { display: none; }
details.yr .chev { transition: transform .2s steps(3); display: inline-flex; }
details.yr[open] .chev { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { details.yr .chev { transition: none; } }
.news { margin-bottom: 14px; }
.news.lead { border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--mint); border-radius: 0; }
.news-cat { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; background: var(--ink); color: var(--page); margin-bottom: 8px; }
.news h3 { font-size: 16px; line-height: 1.45; margin: 0 0 6px; }
.news-body { margin: 0; color: var(--text2); line-height: 1.75; font-size: 14px; }
.news-body.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.news .link { font-size: 13px; margin-top: 6px; }
.news-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; font-size: 12px; }
.ex-row { display: grid; grid-template-columns: 1fr 96px 128px; gap: 8px; margin-bottom: 8px; }
.ex-row .input { padding: 8px 9px; font-size: 14px; }
.gw-log b { color: var(--text); }
.gear-btn.on { color: var(--text); }
@media (min-width: 960px) { .gear-btn { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
// ═════════ 股娃娃：像素小舞台、養成家園、破框演出 ═════════
const GUGU = (() => {
  const NAME = '股娃娃';
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const FPS = 12, STEP = 1 / FPS;
  const sfx = n => { if (typeof SFX !== 'undefined') SFX.play(n); };

  // ── 小怪獸本體（16×14）與表情 ──
  const PAL = { o: '#1B1E3C', b: '#3CCBAA', d: '#23977E', l: '#A6F0DC', w: '#FFFFFF', k: '#1B1E3C', c: '#FF8FA3', y: '#FFC94A', m: '#C2414B' };
  const BODY = [
    '....y......y....',
    '....o......o....',
    '.....o....o.....',
    '...oooooooooo...',
    '..obllbbbbbbbo..',
    '.oblbbbbbbbbbbo.',
    '.obbwwbbbbwwbbo.',
    '.obbwkbbbbwkbbo.',
    '.obcbbbbbbbbcbo.',
    '.obbbbbkkbbbbbo.',
    '.odbbbbbbbbbbdo.',
    '..oddbbbbbbddo..',
    '...oooooooooo...',
    '...oo......oo...',
  ];
  const FACES = {
    idle: {},
    blink: { 6: '.obbbbbbbbbbbbo.', 7: '.obbkkbbbbkkbbo.' },
    happy: { 6: '.obbkkbbbbkkbbo.', 7: '.obkbbkbbkbbkbo.', 9: '.obbbbkmmkbbbbo.' },
    sad: { 6: '.obbkbbbbbbkbbo.', 7: '.obbwkbbbbwkbbo.', 9: '.obbbbbkkbbbbbo.', 10: '.odbbbkbbkbbbdo.' },
    worry: { 6: '.obkbbbbbbbbkbo.', 7: '.obbwkbbbbwkbbo.', 9: '.obbbbbbbbbbbbo.', 10: '.odbbbkkkkbbbdo.' },
    tired: { 6: '.obbbbbbbbbbbbo.', 7: '.obbkkbbbbkkbbo.', 9: '.obbbbbbbbbbbbo.', 10: '.odbbbbkkbbbbdo.' },
    dizzy: { 6: '.obkbkbbbbkbkbo.', 7: '.obbkbbbbbbkbbo.', 8: '.obkbkbbbbkbkbo.', 9: '.obbbbkbkbkbbbo.' },
    eat: { 6: '.obbkkbbbbkkbbo.', 7: '.obkbbkbbkbbkbo.', 9: '.obbbbkmmkbbbbo.', 10: '.odbbbkmmkbbbdo.' },
  };
  const FEET_WALK = '....oo....oo....';

  /** 體型：chubby 圓滾、normal、thin 瘦、flat 餓扁 */
  function shape(rows, body) {
    if (body === 'chubby') {
      const wide = rows.map(r => r.slice(0, 8) + r[7] + r[8] + r.slice(8));
      return wide.slice(0, 11).concat([wide[10]], wide.slice(11));
    }
    if (body === 'thin') return rows.map(r => r.slice(0, 6) + r.slice(7, 9) + r.slice(10));
    if (body === 'flat') return rows.filter((_, i) => i !== 4 && i !== 5 && i !== 11).map((r, i) => (i === 8 ? r : r));
    return rows;
  }
  const cache = {};
  function monSprite(face, body, walk) {
    const key = face + body + (walk ? 1 : 0);
    if (cache[key]) return cache[key];
    let rows = BODY.map((r, i) => (FACES[face] && FACES[face][i]) || r);
    if (walk) rows = rows.slice(0, 13).concat([FEET_WALK]);
    return (cache[key] = shape(rows, body));
  }

  // ── 道具與家園 ──
  const COIN = [
    ['.oooo.', 'oylyyo', 'oylyyo', 'oyyyyo', 'oyyydo', '.oooo.'],
    ['..ooo.', '.olyyo', '.olyyo', '.oyyyo', '.oyydo', '..ooo.'],
    ['..oo..', '..ly..', '..ly..', '..yy..', '..yd..', '..oo..'],
    ['.ooo..', 'oyylo.', 'oyylo.', 'oyyyo.', 'odyyo.', '.ooo..'],
  ];
  const COIN_PAL = { o: '#8A5A00', y: '#FFC94A', l: '#FFF1B8', d: '#E3A21A' };
  const LEAF = [['.ll..', 'lLll.', '.lLll', '..lL.', '...s.'], ['..ll.', '.llLl', 'llLl.', '.Ll..', '.s...']];
  const LEAF_PAL = { l: '#D99A4E', L: '#9C5F2A', s: '#6B4423' };

  function building(w, floors, fancy) {
    const rows = [], half = w / 2, roofH = Math.max(4, Math.round(w / 4));
    for (let i = 0; i < roofH; i++) {
      const span = Math.round(((i + 1) / roofH) * half);
      let row = '';
      for (let x = 0; x < w; x++) {
        const dx = x < half ? Math.floor(half) - 1 - x : x - Math.ceil(half);
        row += dx >= span ? '.' : dx === span - 1 ? 'o' : i % 2 ? 'R' : 'r';
      }
      rows.push(row);
    }
    rows.push('o'.repeat(w));
    const mid = (w - 1) / 2;
    for (let f = floors - 1; f >= 0; f--) {
      for (let j = 0; j < 4; j++) {
        let row = '';
        for (let x = 0; x < w; x++) {
          if (x === 0 || x === w - 1) { row += 'o'; continue; }
          const door = f === 0 && Math.abs(x - mid) < 1.1 && j >= 1;
          const nearDoor = f === 0 && Math.abs(x - mid) < 3;
          const win = !door && !nearDoor && j >= 1 && j <= 2 && x > 1 && x < w - 2 && (x - 2) % 5 < 2;
          row += door ? 'd' : win ? 'n' : j === 3 ? 'W' : 'w';
        }
        rows.push(row);
      }
      if (f > 0) rows.push(fancy ? 'o' + 'y'.repeat(w - 2) + 'o' : 'o'.repeat(w));
    }
    rows.push('o'.repeat(w));
    return rows;

  /**

   *          care: { daysAway 幾天沒打開, petsToday 今天摸了幾次 } }
   */
  function computeState(input) {
    const lvl = LEVELS.reduce((n, l, i) => (input.ath >= l[0] ? i : n), 0);
    const recent = (input.saved || []).slice(-3);
    let lush = recent.filter(v => v > 0).length; // 0..3

    const fullness = clamp(30 + lush * 20 + (input.daysSinceRecord <= 30 ? 10 : -20) + (st > 0 ? 5 : 0), 0, 100);

  function achievements(input) {
    const out = [], pts = input.points || [];
    let best = 0;
    pts.forEach(p => {
      while (p.total >= best + 500000) {
        best += 500000;
        const label = best === 1000000 ? '第一桶金！資產突破 100 萬' : '資產突破 ' + (best >= 1e8 ? best / 1e8 + ' 億' : best / 1e4 + ' 萬');
        out.push({ id: 'm' + best, kind: 'milestone', label, date: p.date, amount: best });
      }
    });

        // 跌到中跌以上：一直撐著傘，停下來就蹲坐
        const rainy = T.dir < 0 && T.lv >= 1;
        m.prop = rainy ? 'umbrella' : null;
        m.sit = rainy && m.walkTo === null;
        m.y = m.walk ? (S.tick % 4 < 2 ? -1 : 0) : T.dir > 0 && T.lv >= 2 ? hop((S.tick % 8) / 8, 3) : m.hopUntil > S.tick ? hop(1 - (m.hopUntil - S.tick) / 6, 5) : S.tick % 12 < 6 ? 0 : -1;
        m.face = S.tick % 40 >= 38 && base !== 'happy' ? 'blink' : base;
        ambient();
        // 天氣帶來的常駐效果
        if (st.weather === 'sunny' && S.tick % 30 === 0 && S.parts.filter(p => p.k === 'fly').length < 3) S.parts.push({ k: 'fly', x: S.pan + rnd(0, S.W), y: rnd(8, groundY() - 8), life: 8, ph: rnd(0, 6) });
        if (st.lush >= 2 && st.wilt === 0 && S.tick % 50 === 0) S.parts.push({ k: 'petal', x: S.pan + rnd(0, S.W), y: -2, vy: 6, vx: 3, life: 6, c: pick(FLOWER_COLORS) });
      }
      const T = S.today;
      const idleRain = S.scene ? 0 : T.dir < 0 ? (T.lv >= 2 ? 3 : T.lv === 1 && S.tick % 2 === 0 ? 1 : 0) : T.dir > 0 ? 0 :
        (st.weather === 'storm' ? 2 : st.weather === 'rain' && S.tick % 2 === 0 ? 1 : 0);
      const rain = S.rain || idleRain;
      for (let i = 0; i < rain; i++) S.parts.push({ k: 'drop', x: S.darkCloud && S.scene ? rnd(S.darkCloud.x + 2, S.darkCloud.x + S.darkCloud.w - 2) : S.pan + rnd(-4, S.W + 4), y: S.darkCloud && S.scene ? S.darkCloud.y + 6 : -2, vy: rnd(40, 55), life: 1 });
      // 房子冒煙、噴泉水花、城堡煙火
      const house = S.items.find(it => it.smoke);
      if (house && st.wilt < 2 && S.tick % 9 === 0) S.parts.push({ k: 'smoke', back: true, x: house.x + (house.chim || 15), y: house.y - 1, vx: rnd(1, 3), vy: -4, life: 2.2, mid: true });
      const ft = S.items.find(it => it.fountain);
      if (ft && st.wilt < 2 && S.tick % 2 === 0) S.parts.push({ k: 'px', back: true, mid: true, x: ft.x + 6 + rnd(-1, 1), y: ft.y, vx: rnd(-8, 8), vy: rnd(-14, -8), g: 40, c: pick(['#6FB7FF', '#FFFFFF']), life: 0.6 });
      if (st.level >= 11 && !S.scene && (S.theme === 'dark' || st.weather === 'sunny') && S.tick % 40 === 0) burst(S.pan + rnd(10, S.W - 10), rnd(4, 12), 12, ['#FFC94A', '#FF8FA3', '#8BE9D4', '#FFFFFF']);
      S.parts = S.parts.filter(p => {
        p.age = (p.age || 0) + STEP;
        if (p.vx) p.x += p.vx * STEP;
        if (p.vy) p.y += p.vy * STEP;
        if (p.g) p.vy += p.g * STEP;
        if (p.upd) p.upd(p);
        return p.age < p.life && p.y < S.H + 8;
      });
      if (S.flash > 0) S.flash--;
      if (opts.page) opts.page.update();
    }

    /** 待機時依今天的漲跌持續產生天氣與小動作 */
    function ambient() {
      const T = S.today, m = S.mon, cx = m.wx + 8, top = groundY() - 14;
      if (!(T.dir < 0 && T.lv >= 2) && S.darkCloud && S.darkCloud.ambient) S.darkCloud = null;
      if (T.dir < 0) {
        if (S.tick % (T.lv >= 1 ? 70 : 45) === 0) S.parts.push({ k: 'leaf', x: S.pan + rnd(0, S.W), y: -5, vy: rnd(7, 11), vx: rnd(2, 5), life: 6 });
        if (T.lv >= 1 && S.tick % 180 === 60) S.parts.push({ k: 'tumble', back: true, x: S.pan - 12, y: groundY() - 11, vx: 22, life: 7, upd(p) { p.y = groundY() - 11 - Math.abs(Math.round(Math.sin(p.age * 5) * 3)); } });
        if (T.lv >= 2) {
          if (!S.darkCloud) S.darkCloud = { rows: cloudShape(26, 9), x: m.wx - 5, y: 1, w: 26, ambient: true };
          S.darkCloud.x += Math.round((m.wx - 5 - S.darkCloud.x) * 0.2);
          if (S.tick % 30 === 0) S.parts.push({ k: 'tear', x: m.wx + rnd(4, 12), y: groundY() - 7, vy: 18, life: 0.4 });
          if (S.tick % 110 === 55) {
            S.flash = 2; sfx('thunder');
            let x = Math.round(m.wx + rnd(-10, 26)); const pts = [];
            for (let y = 9; y < groundY(); y++) { pts.push([x, y]); if (y % 3 === 0) x += Math.random() < 0.5 ? -1 : 1; }
            S.parts.push({ k: 'bolt', x: 0, y: 0, pts, life: 0.25 });
          }
        }
      } else if (T.dir > 0) {
        if (S.tick % (T.lv >= 1 ? 24 : 40) === 0) sparkles(cx, top - 2, T.lv >= 1 ? 3 : 2, 9);
        if (T.lv >= 1 && S.tick % 30 === 0 && S.parts.filter(p => p.k === 'fly').length < 3) S.parts.push({ k: 'fly', x: S.pan + rnd(0, S.W), y: rnd(8, groundY() - 8), life: 8, ph: rnd(0, 6) });
        if (T.lv >= 1 && S.tick % 60 === 20) S.parts.push({ k: 'coin', x: cx + rnd(-3, 3), y: -4, vy: 26, life: 2, upd(p) {
          if (p.y >= groundY() - 14 + S.mon.y) { p.age = 99; sparkles(p.x, groundY() - 16, 2, 3); S.mon.hopUntil = S.tick + 6; sfx('coin'); }
        } });
        if (T.lv >= 2) {
          if (S.tick % 30 === 0) { burst(S.pan + rnd(10, S.W - 10), rnd(4, 12), 14, UPC()); sfx('boom'); }
          if (S.tick % 2 === 0) S.parts.push({ k: 'px', x: S.pan + rnd(0, S.W), y: -2, vy: rnd(14, 22), vx: rnd(-4, 4), c: pick(UPC()), life: 3 });
        }
      }
    }

    // ── 畫面 ──
    const THEME = {
      light: { sky: ['#C4E8FA', '#D3EEFB', '#E0F3FC', '#ECF8FD'], gray: ['#C9CDD8', '#D2D5DF', '#DBDDE5', '#E4E6EC'], hill: '#A8D3EE', hill2: '#B9C6D6', ground: '#D7DBEA', top: '#B9BED6', cloud: '#FFFFFF', star: null },
      dark: { sky: ['#151938', '#191E44', '#1E244F', '#242B5B'], gray: ['#17192A', '#1B1D30', '#202336', '#25283C'], hill: '#2A3266', hill2: '#272A40', ground: '#232950', top: '#323A6E', cloud: '#2E3566', star: '#FFF6C9' },
    };
    function draw() {
      const th = THEME[S.theme], st = S.state, g = groundY();
      const gloomy = S.today.dir < 0 || (S.today.dir === 0 && (st.weather === 'rain' || st.weather === 'storm')) || (S.scene && S.scene.gloomy);
      const bands = gloomy ? th.gray : th.sky;
      const bh = Math.ceil(g / bands.length);
      bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * bh, S.W, bh); });
      const fs = farShift();
      if (th.star) S.stars.forEach(s => { if (Math.sin(S.tick / 4 + s.ph) > 0.2) dot(ctx, s.x - S.pan * 0.2 + fs, s.y, th.star); });
      // 太陽／月亮
      if (S.theme === 'dark') spr(ctx, MOON, S.W - 12 + fs, 4, { m: '#FFF1B8' });
      else if (!gloomy && (S.today.dir > 0 || st.weather === 'sunny' || st.weather === 'clear')) { spr(ctx, SUN, S.W - 13 + fs, 3, { y: '#FFD84A' }); if ((st.weather === 'sunny' || (S.today.dir > 0 && S.today.lv >= 1)) && S.tick % 12 < 6) { dot(ctx, S.W - 11 + fs, 1, '#FFE68A'); dot(ctx, S.W - 6 + fs, 5, '#FFE68A'); } }
      // 遠山
      ctx.fillStyle = gloomy ? th.hill2 : th.hill;
      const hp = Math.round(S.pan * 0.3) - fs;
      for (let x = 0; x < S.W; x++) { const h = S.hills[x + hp] || 4; ctx.fillRect(x, g - h, 1, h); }
      // 雲
      S.clouds.forEach(c => {
        const x = Math.round(c.x - S.pan * 0.5 + fs);
        ctx.fillStyle = gloomy ? (S.theme === 'dark' ? '#2A2D44' : '#EEF0F4') : th.cloud;
        ctx.fillRect(x + 1, Math.round(c.y), c.w - 2, 1); ctx.fillRect(x, Math.round(c.y) + 1, c.w, 2);
      });
      const ns = nearShift(), ms = midShift();
      const nx = wx => wx - S.pan + ns, mx = wx => wx - S.pan * 0.92 + ms;
      if (S.darkCloud) spr(ctx, S.darkCloud.rows, nx(S.darkCloud.x), S.darkCloud.y, { o: '#3B4060', g: '#6E7487', G: '#565C72' });
      // 地面
      ctx.fillStyle = th.top; ctx.fillRect(0, g, S.W, 1);
      ctx.fillStyle = th.ground; ctx.fillRect(0, g + 1, S.W, S.H - g - 1);
      for (let x = ((-Math.round(S.pan) % 6) + 6) % 6; x < S.W; x += 6) dot(ctx, x, g + 3, th.top, 2);
      if (st.wilt >= 3) { ctx.fillStyle = '#8C7A5A'; for (let i = 0; i < S.WW; i += 13) { const x = nx(i); ctx.fillRect(x, g + 1, 1, 1); ctx.fillRect(x + 1, g + 2, 1, 1); ctx.fillRect(x + 1, g + 3, 2, 1); } }
      // 家園（中景）
      if (st.level >= 7) { ctx.fillStyle = S.theme === 'dark' ? '#3A4378' : '#E9ECF5'; for (let i = 0; i < S.WW; i += 5) ctx.fillRect(mx(i), g + 1, 3, 1); }
      S.items.forEach(it => {
        if (it.bunting) {
          const cols = ['#E5484D', '#FFC94A', '#3CCBAA', '#8B7CF6', '#FF8FA3'];
          for (let x = it.x1, i = 0; x < it.x2; x += 3, i++) {
            const sag = Math.round(Math.sin(((x - it.x1) / (it.x2 - it.x1)) * Math.PI) * 3);
            dot(ctx, mx(x), it.y + sag, '#4A4F6E'); dot(ctx, mx(x + 1), it.y + sag, '#4A4F6E');
            if (i % 2 === 0) { dot(ctx, mx(x), it.y + sag + 1, cols[(i / 2) % 5], 2); dot(ctx, mx(x) + 0.5, it.y + sag + 3, cols[(i / 2) % 5]); }
          }
          return;
        }
        const pal = it.pal || (it.f ? Object.assign({}, st.wilt >= 1 ? WILT_PAL : HP, { f: st.wilt >= 1 ? '#A8845A' : it.f }) : it.wiltable && st.wilt >= 2 ? WILT_PAL : HP);
        spr(ctx, it.s, mx(it.x), it.y, pal);
        if (it.statue) { const gs = monSprite('happy', 'normal', false); spr(ctx, gs, mx(it.x) + 1, it.y - gs.length, GOLD); if (S.tick % 30 < 3) plus(ctx, mx(it.x) + 4 + (S.tick % 7), it.y - 10, '#FFFFFF'); }
        if (it.lamp && (S.theme === 'dark' || gloomy)) { ctx.globalAlpha = S.tick % 24 < 20 ? 0.55 : 0.35; plus(ctx, mx(it.x) + 1, it.y, '#FFE68A', true); ctx.globalAlpha = 1; }
      });
      // 紀念旗區
      S.flags.forEach((f, i) => {
        const fx = 3 + i * 5, fy = g - 7;
        spr(ctx, MINI_FLAG, mx(fx), fy, { o: '#6B4423', F: f.color });
        if (f.fresh && S.tick % 12 < 6) plus(ctx, mx(fx) + 2, fy - 3, '#FFC94A');
      });
      if (S.flag) { const h = S.items.find(it => it.smoke) || { x: S.WW * 0.6, y: g - 12 }; spr(ctx, FLAG, mx(h.x - 6), g - 10, FLAG_PAL); }
      S.parts.filter(p => p.back).forEach(p => drawPart(p, p.mid ? mx : nx));
      // 小怪獸（近景）
      const m = S.mon;
      if (!m.out) {
        const sp = monSprite(m.face, S.state.body, m.walk);
        const my = g - sp.length + m.y + (m.sit ? 1 : 0);
        const sx = nx(m.wx) - (sp[0].length - 16) / 2;
        if (m.prop === 'flame') spr(ctx, FLAME[S.tick % 2], sx + 4, g + m.y, FLAME_PAL);
        spr(ctx, sp, sx, my, PAL, m.flip);
        if (S.leafOnHead) spr(ctx, LEAF[0], sx + 9, my + 1, LEAF_PAL);
        if (m.prop === 'umbrella') spr(ctx, UMBRELLA, sx + 1, my - 9, UMB_PAL);
        if (m.prop === 'flag') spr(ctx, FLAG, sx + 13, my - 4, FLAG_PAL);
        if (S.state.lonely && !S.scene && S.tick % 24 < 16) { for (let i = 0; i < 3; i++) if (S.tick % 24 >= i * 4) dot(ctx, sx + 12 + i * 2, my - 3, S.theme === 'dark' ? '#B9BDD6' : '#4A4F6E'); }
      }
      S.parts.filter(p => !p.back).forEach(p => drawPart(p, nx));
      if (S.flash > 0) { ctx.globalAlpha = 0.55; ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, S.W, S.H); ctx.globalAlpha = 1; }
      placeBubble();
      if (opts.page) opts.page.draw();
    }
    function drawPart(p, X) {
      const x = X(p.x);
      switch (p.k) {
        case 'coin': spr(ctx, COIN[Math.floor(p.age * 10) % 4], x - 3, p.y - 3, COIN_PAL); break;
        case 'spark': if (Math.floor(p.age * 12) % 2 === 0 || p.age < p.life * 0.5) plus(ctx, x, p.y, p.c, p.big); break;
        case 'px': dot(ctx, x, p.y, p.c); break;
        case 'heart': spr(ctx, HEART, x - 2, p.y, HEART_PAL); break;
        case 'drop': ctx.fillStyle = '#7FA7D6'; ctx.fillRect(Math.round(x), Math.round(p.y), 1, 2); break;
        case 'leaf': spr(ctx, LEAF[Math.floor(p.age * 3) % 2], x, p.y, LEAF_PAL); break;
        case 'puff': dot(ctx, x, p.y, S.theme === 'dark' ? '#8C92B5' : '#A9AEC4', p.age < .5 ? 1 : 2); break;
        case 'smoke': dot(ctx, x, p.y, S.theme === 'dark' ? '#5A608A' : '#E6E8EF', p.age < 1 ? 1 : 2); break;
        case 'tumble': spr(ctx, TUMBLE[Math.floor(p.age * 8) % 4], x, p.y, { t: '#A88B5A' }); break;
        case 'tear': dot(ctx, x, p.y, '#6FB7FF'); break;
        case 'zz': [[0, 0], [1, 0], [2, 0], [1, 1], [0, 2], [1, 2], [2, 2]].forEach(([a, b]) => dot(ctx, x + a, p.y + b, S.theme === 'dark' ? '#B9BDD6' : '#4A4F6E')); break;
        case 'fly': spr(ctx, BUTTERFLY[S.tick % 4 < 2 ? 0 : 1], x + Math.sin(p.age * 2 + p.ph) * 6, p.y + Math.sin(p.age * 3 + p.ph) * 3, { y: '#FFC94A', o: '#1B1E3C' }); break;
        case 'petal': dot(ctx, x + Math.sin(p.age * 2) * 3, p.y, p.c); break;
        case 'bolt': ctx.fillStyle = '#FFE36E'; p.pts.forEach(([bx, by]) => ctx.fillRect(X(bx), by, 1, 1)); break;
      }
    }
    function frame(now) {
      S.acc += Math.min(0.25, (now - S.last) / 1000 || 0);
      S.last = now;
      let n = 0;
      while (S.acc >= STEP && n < 4) { update(); S.acc -= STEP; n++; }
      if (n) draw();
      S.raf = requestAnimationFrame(frame);
    }

    // ── 舞台在頁面上的位置換算（給破框用） ──
    function cw() { return canvas.getBoundingClientRect().width / S.W; }
    function monPage() {
      const r = canvas.getBoundingClientRect(), s = cw();
      return { x: r.left / s + (S.mon.wx - S.pan + nearShift()), y: r.top / s + groundY() - 14 + S.mon.y, s };
    }

    // ═════════ 演出 ═════════
    const UPC = () => [cssVar('--up', '#E5484D'), '#FFC94A', '#FF8FA3', '#8BE9D4', '#FFFFFF'];
    function burst(x, y, n, cols) {
      for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, sp = rnd(14, 26); S.parts.push({ k: 'px', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 18, c: pick(cols), life: rnd(0.7, 1.1) }); }
    }
    function sparkles(x, y, n, spread) {
      for (let i = 0; i < n; i++) S.parts.push({ k: 'spark', x: x + rnd(-spread, spread), y: y + rnd(-spread / 2, spread / 3), c: pick(['#FFC94A', '#FFFFFF', '#FF8FA3']), life: rnd(0.5, 0.9), big: Math.random() < 0.3 });
    }
    function hearts(x, y, n) { for (let i = 0; i < n; i++) S.parts.push({ k: 'heart', x: x + rnd(-6, 6), y: y - rnd(0, 4), vy: rnd(-12, -7), vx: rnd(-3, 3), life: 1.2 }); }
    const hop = (p, h) => -Math.round(h * Math.sin(Math.PI * clamp(p, 0, 1)));
    const at = (t, x) => Math.abs(t - x) < STEP / 2;
    const center = () => S.mon.wx + 8;

    /** 跳出舞台到頁面上的某個點，做事，再跳回來 */
    function excursion(t, t0, getTarget, during, label) {
      const page = opts.page, m = S.mon;
      if (!page) return false;
      const k = t - t0;
      if (k < 0) return false;
      if (!S.ex) {
        const from = monPage();
        let to = getTarget();
        if (!to) to = { x: from.x, y: from.y - 26 };
        S.ex = { from, to };
        m.out = true;
        page.show(m.face, S.state.body);
      }
      const { from, to } = S.ex;
      const back = monPage();
      if (k < 0.6) { const p = k / 0.6; page.set(from.x + (to.x - from.x) * p, from.y + (to.y - from.y) * p - Math.sin(Math.PI * p) * 22, 'happy'); }
      else if (k < 0.6 + during.dur) { during.step(k - 0.6, to); }
      else if (k < 1.2 + during.dur) { const p = (k - 0.6 - during.dur) / 0.6; page.set(to.x + (back.x - to.x) * p, to.y + (back.y - to.y) * p - Math.sin(Math.PI * p) * 18, 'happy'); }
      else { m.out = false; page.hide(); S.ex = null; return true; }
      return false;
    }
    function heroTarget(dx) {
      const el = opts.heroEl && opts.heroEl();
      if (!el) return null;
      const r = el.getBoundingClientRect(), s = cw();
      if (r.bottom < 40 || r.top > innerHeight - 40) return null;
      return { x: (r.left + r.width * (dx || 0.5)) / s - 8, y: r.top / s - 14, el };
    }
    function press(el) { if (!el) return; el.classList.add('gw-pressed'); setTimeout(() => el.classList.remove('gw-pressed'), 160); }

    const SCENES = {
      up1: () => ({ dur: 2.6, step(t) {
        const m = S.mon; m.face = 'happy';
        m.y = t < 0.5 ? hop(t / 0.5, 6) : t < 1.0 ? hop((t - 0.5) / 0.5, 4) : 0;
        if (at(t, 0.25)) { sfx('up1'); say('耶！', 2); S.parts.push({ k: 'coin', x: center(), y: groundY() - 20, vy: -9, life: 1.6 }); sparkles(center(), groundY() - 20, 5, 7); }
      } }),
      up2: () => ({ dur: 4.4, step(t) {
        const m = S.mon; m.face = 'happy';
        if (at(t, 0)) { sfx('up2'); say('金幣雨～', 3); }
        const beat = Math.floor(t / 0.35);
        m.flip = beat % 2 === 1;
        m.wx = home() + (beat % 4 < 2 ? -4 : 4);
        m.y = hop((t % 0.35) / 0.35, 3);
        if (t < 3.2 && S.tick % 2 === 0) S.parts.push({ k: 'coin', x: home() + 8 + rnd(-18, 18), y: -4, vy: rnd(20, 30), life: 3, upd(p) {
          const top = groundY() - 14 + S.mon.y;
          if (p.y >= top && Math.abs(p.x - center()) < 8) { p.age = 99; sparkles(p.x, top, 2, 3); sfx('coin'); }
          else if (p.y >= groundY() - 3) p.age = 99;
        } });
      }, end() { S.mon.wx = home(); S.mon.flip = false; } }),
      // 大漲：噴射衝出舞台，降落在總資產卡上，蹦跳放煙火，再跳回來
      up3: () => ({ dur: 6, step(t) {
        const m = S.mon; m.face = 'happy';
        if (at(t, 0)) { sfx('charge'); say('衝啊！', 1.2); }
        if (at(t, 0.5)) sfx('rocket');
        if (t < 0.5) { m.y = 1; m.wx = home() + (S.tick % 2 ? 1 : 0); return; }
        if (t < 1.0) { m.prop = 'flame'; m.y = -Math.round(Math.pow((t - 0.5) / 0.5, 2) * 16); S.parts.push({ k: 'px', back: true, x: center() + rnd(-3, 3), y: groundY() - 1, vx: rnd(-10, 10), vy: rnd(-6, -2), c: pick(['#C9CEDF', '#FFFFFF']), life: 0.8 }); return; }
        m.prop = null;
        const done = excursion(t, 1.0, () => heroTarget(0.5), { dur: 2.6, step(k, to) {
          const b = k < 0.9 ? hop((k % 0.45) / 0.45, 5) : 0;
          if (k < STEP) press(to.el);
          if (at(k, 0.45)) press(to.el);
          opts.page.set(to.x, to.y + b, k > 1.0 ? 'happy' : 'happy');
          if (at(k, 0.2)) { sfx('fanfare'); opts.page.confetti(); opts.page.say('破框啦！', 2); }
          if (k > 0.3 && k < 2.2 && S.tick % 4 === 0) { opts.page.firework(to.x + rnd(-40, 56), to.y - rnd(6, 26)); sfx('boom'); }
        } });
        if (done) { m.y = 0; }
      }, end() { S.mon.prop = null; S.mon.y = 0; S.mon.out = false; S.ex = null; if (opts.page) opts.page.hide(); } }),
      down1: () => ({ dur: 3.4, step(t) {
        const m = S.mon; m.face = 'sad';
        if (at(t, 0)) { sfx('down1'); say('唉…', 2.5); S.leafOnHead = false; }
        if (t > 0.3 && t < 1.2 && S.tick % 3 === 0) S.parts.push({ k: 'puff', x: center() + 5, y: groundY() - 6, vx: rnd(4, 8), vy: rnd(-3, -1), life: 1.2 });
        if (at(t, 0.5)) S.parts.push({ k: 'leaf', x: center(), y: -5, vy: 9, life: 2.6, upd(p) {
          p.x = S.mon.wx + 9 + Math.round(Math.sin(p.age * 2.4) * 5);
          if (p.y >= groundY() - 14 + S.mon.y + 1) { p.age = 99; S.leafOnHead = true; }
        } });
      } }),
      down2: () => ({ dur: 5, gloomy: true, step(t) {
        const m = S.mon; m.face = 'sad'; m.sit = true; m.prop = 'umbrella';
        if (at(t, 0)) { sfx('down2'); say('下雨了…', 3); S.leafOnHead = false; }
        S.rain = t < 4.3 ? 1 : 0;
        if (at(t, 0.8)) S.parts.push({ k: 'tumble', back: true, x: S.pan - 12, y: groundY() - 11, vx: 24, life: 6, upd(p) { p.y = groundY() - 11 - Math.abs(Math.round(Math.sin(p.age * 5) * 3)); } });
      }, end() { S.mon.prop = null; S.mon.sit = false; S.rain = 0; } }),
      // 大跌：烏雲壓頂，雨從舞台漏到下面的卡片
      down3: () => ({ dur: 6.4, gloomy: true, step(t) {
        const m = S.mon; m.face = t < 2.5 ? 'worry' : 'sad'; m.prop = t > 2.4 ? 'umbrella' : null;
        if (at(t, 0)) { sfx('down3'); S.leafOnHead = false; S.darkCloud = { rows: cloudShape(26, 9), x: S.pan - 26, y: 1, w: 26 }; }
        if (S.darkCloud) S.darkCloud.x = Math.min(m.wx - 5, Math.round(S.pan - 26 + t * 40));
        S.rain = t > 0.8 && t < 5.8 ? 3 : 0;
        if (t > 1 && t < 2.4 && S.tick % 4 === 0) S.parts.push({ k: 'tear', x: m.wx + rnd(4, 12), y: groundY() - 7, vy: 18, life: 0.4 });

          for (let y = 9; y < groundY(); y++) { pts.push([x, y]); if (y % 3 === 0) x += Math.random() < 0.5 ? -1 : 1; }

      // 連點兩下：跳高高
      jump: () => ({ dur: 1.1, light: true, step(t) {

      // 一直戳：轉圈圈頭暈
      dizzy: () => ({ dur: 2.8, step(t) {
        const m = S.mon;
        if (at(t, 0)) { sfx('dizzy'); say(pick(['頭暈了～', '不要一直戳啦！', '轉圈圈…咕嚕咕嚕', '星星在轉…']), 2.6); }
        m.face = t < 1.0 ? 'happy' : 'dizzy';
        m.flip = t < 1.0 ? S.tick % 2 === 0 : false;
        m.y = t < 1.0 ? -1 : 0;
        m.wx = home() + (t > 1.0 ? Math.round(Math.sin(t * 6) * 2) : 0);
        if (t > 1.0 && S.tick % 3 === 0) { const a = t * 5; S.parts.push({ k: 'spark', x: center() + Math.cos(a) * 9, y: groundY() - 19 + Math.sin(a) * 2, c: '#FFC94A', life: 0.3 }); }
      }, end() { S.mon.wx = home(); S.mon.flip = false; } }),
      // 摸摸
      pet: () => ({ dur: 1.6, light: true, step(t) {
        const m = S.mon; m.face = 'happy';
        m.y = hop(t / 0.5, 4);
        if (at(t, 0)) { sfx('pet'); hearts(center(), groundY() - 16, 3); say(pick(petLines()), 2.5); }
      } }),
      // 寂寞後重逢
      reunion: () => ({ dur: 2.6, step(t) {
        const m = S.mon; m.face = 'happy';
        m.y = t < 1.5 ? hop((t % 0.5) / 0.5, 6) : 0;
        if (at(t, 0)) { sfx('reunion'); say('你終於來了！', 3); hearts(center(), groundY() - 16, 5); }
      } }),
      // 記帳餵食
      eat: () => ({ dur: 3, step(t) {
        const m = S.mon;
        if (at(t, 0)) sfx('coinDrop');
        if (at(t, 0)) S.parts.push({ k: 'coin', x: center(), y: -6, vy: 30, life: 1.2, upd(p) { if (p.y >= groundY() - 7) p.age = 99; } });
        m.face = t > 0.9 && t < 2.0 ? (S.tick % 3 === 0 ? 'happy' : 'eat') : 'happy';
        if (at(t, 1.0)) { sfx('chomp'); say('好吃！記帳辛苦了', 2.5); hearts(center(), groundY() - 16, 2); }
        m.y = t > 2 ? hop((t - 2) / 0.4, 3) : 0;
      } }),
      // 創新高：扛旗跳上主卡插旗
      flag: () => ({ dur: 4.2, step(t) {
        const m = S.mon; m.face = 'happy';
        if (at(t, 0)) { sfx('flagUp'); say('創新高！', 1.4); m.prop = 'flag'; }
        if (t < 0.5) return;
        m.prop = null;
        const done = excursion(t, 0.5, () => heroTarget(0.86), { dur: 1.6, step(k, to) {
          opts.page.set(to.x, to.y + (k < 0.4 ? hop(k / 0.4, 4) : 0), 'happy', k < 0.5 ? 'flag' : null);
          if (at(k, 0.5)) { sfx('flag'); S.flagOnHero = true; opts.page.plantFlag(to.el); press(to.el); opts.page.say('插旗！', 2); }
        } });
        if (done) m.y = 0;
      }, end() { S.mon.prop = null; S.mon.out = false; S.ex = null; if (opts.page) opts.page.hide(); } }),
    };
    function petLines() {
      const st = S.state;
      if (S.sleepy) return ['嗯…？你也睡不著嗎', 'Zzz…（被摸醒）', '好睏…明天再看盤吧', '早點睡，錢不會跑掉的'];
      const l = ['嘿嘿', '再摸一下', '今天也要記得喝水', '好癢！', '最喜歡你了', '摸頭會長高嗎？', '嗯～舒服', '再摸就要收費了（騙你的）'];
      if (opts.petLines) l.push(...opts.petLines());
      if (st.streak >= 3) l.push(st.streak + ' 連漲！我好圓', '最近好開心～');
      if (st.streak <= -2) l.push('肚子有點餓…', '會漲回來的吧？');
      if (st.level >= 5) l.push('我們的房子很溫暖');
      return l;
    }

    const reduce = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    function play(name) {
      if (!SCENES[name]) return;
      if (S.mon.out && opts.page) opts.page.hide();
      S.parts = S.parts.filter(p => p.k === 'fly'); S.rain = 0; S.darkCloud = null; S.ex = null;
      Object.assign(S.mon, { prop: null, y: 0, flip: false, out: false, sit: false, walkTo: null, walk: false, wx: home() });
      S.pan = clamp(S.mon.wx + 8 - S.W / 2, 0, S.WW - S.W);
      if (reduce()) { const s = SCENES[name](); s.step(0); S.scene = null; return; }
      S.scene = SCENES[name]();
      S.t = 0;
    }

    // ── 互動：點、長按、拖曳、傾斜 ──
    let down = null, lp = 0, tiltAsked = false, taps = [];
    function hitFlag(ev) {
      const r = canvas.getBoundingClientRect(), s = r.width / S.W;
      const x = (ev.clientX - r.left) / s, y = (ev.clientY - r.top) / s;
      const shift = S.pan * 0.92 - midShift();
      return S.flags.findIndex((f, i) => { const fx = 3 + i * 5 - shift; return x >= fx - 1 && x <= fx + 4 && y >= groundY() - 9 && y <= groundY(); });
    }
    function hitMon(ev) {
      const r = canvas.getBoundingClientRect(), s = r.width / S.W;
      const x = (ev.clientX - r.left) / s, y = (ev.clientY - r.top) / s;
      const sx = S.mon.wx - S.pan + nearShift(), sy = groundY() - 14 + S.mon.y;
      return { hit: x >= sx - 2 && x <= sx + 18 && y >= sy - 3 && y <= sy + 15, wx: x + S.pan - nearShift() };
    }
    canvas.addEventListener('pointerdown', ev => {
      down = { x: ev.clientX, y: ev.clientY, pan: S.pan, drag: false, long: false };
      clearTimeout(lp);
      lp = setTimeout(() => { if (down && !down.drag && hitMon(ev).hit) { down.long = true; sfx('menu'); if (opts.onLongPress) opts.onLongPress(); } }, 550);
      askTilt();
    });
    canvas.addEventListener('pointermove', ev => {
      if (!down) return;
      const dx = ev.clientX - down.x;
      if (Math.abs(dx) > 6) { down.drag = true; clearTimeout(lp); }
      if (down.drag) S.pan = clamp(down.pan - dx / cw(), 0, S.WW - S.W);
    });
    const endPtr = ev => {
      clearTimeout(lp);
      if (!down) return;
      const d = down; down = null;
      if (d.drag || d.long || (S.scene && !S.scene.light)) return;
      const fi = hitFlag(ev);
      if (fi >= 0) { sfx('ding'); const f = S.flags[fi]; say(f.label + (f.date ? '（' + f.date.replace(/-/g, '/') + '）' : ''), 4); S.mon.walkTo = clamp(3 + fi * 5 + 6, 2, S.WW - 18); return; }
      const h = hitMon(ev);
      if (h.hit) {
        // 連點兩下跳高、1.8 秒內戳 6 下會頭暈
        const now = performance.now();
        taps = taps.filter(x => now - x < 1800); taps.push(now);
        if (S.state.lonely) { play('reunion'); S.state.lonely = false; }
        else if (taps.length >= 6) { taps = []; play('dizzy'); }
        else if (taps.length >= 2 && now - taps[taps.length - 2] < 400) play('jump');
        else play('pet');
        if (opts.onTap) opts.onTap();
      }
      else if (!S.scene) { sfx('click'); S.mon.walkTo = clamp(Math.round(h.wx - 8), 2, S.WW - 18); }
    };
    canvas.addEventListener('pointerup', endPtr);
    canvas.addEventListener('pointercancel', () => { clearTimeout(lp); down = null; });
    canvas.style.touchAction = 'pan-y';

    function onTilt(e) { if (e.gamma != null) S.tiltT = clamp(e.gamma / 25, -1, 1); }
    function askTilt() {
      if (tiltAsked) return;
      tiltAsked = true;
      const D = window.DeviceOrientationEvent;
      if (!D) return;
      if (typeof D.requestPermission === 'function') D.requestPermission().then(r => { if (r === 'granted') addEventListener('deviceorientation', onTilt); }).catch(() => {});
      else addEventListener('deviceorientation', onTilt);
    }
    addEventListener('scroll', () => { const r = canvas.getBoundingClientRect(); S.scroll = clamp((r.top - innerHeight / 3) / 60, -3, 3); }, { passive: true });

    function start() { resize(); cancelAnimationFrame(S.raf); S.last = performance.now(); S.raf = requestAnimationFrame(frame); }
    function stop() { cancelAnimationFrame(S.raf); S.raf = 0; }
    function seek(name, t) { resize(); if (name) play(name); for (let i = 0, n = Math.round(t / STEP); i < n; i++) update(); draw(); }
    return { start, stop, play, seek, resize, say, setState, setTheme(t) { S.theme = t; }, setFlag(v) { S.flag = v; }, setFlags(list) { S.flags = list || []; }, redraw: () => draw(), state: S,
      /** 今天的漲跌（小數，例如 -0.0145）；盤中更新時重設 */
      setToday(p) { const a = Math.abs(p || 0); S.today = a < 0.0005 ? { dir: 0, lv: 0 } : { dir: p > 0 ? 1 : -1, lv: a < 0.005 ? 0 : a < 0.015 ? 1 : 2 }; } };
  }

  // ═════════ 頁面層：小怪獸跳出舞台、彩帶、漏雨、插旗 ═════════
  function PageLayer() {
    let cv, ctx, W, H, s = 4, parts = [], mon = null, bubble, bubbleEnd = 0, flagEl = null, tick = 0;
    function setup(scale) {
      s = scale || s;
      if (!cv) {
        cv = document.createElement('canvas'); cv.className = 'gw-page'; cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv);
        ctx = cv.getContext('2d');
        bubble = document.createElement('div'); bubble.className = 'gw-bubble gw-page-bubble'; document.body.appendChild(bubble);
      }
      W = Math.ceil(innerWidth / s); H = Math.ceil(innerHeight / s);
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    }
    function update() {
      tick++;
      parts = parts.filter(p => {
        p.age = (p.age || 0) + STEP;
        if (p.age < 0) return true;
        p.x += (p.vx || 0) * STEP; p.y += (p.vy || 0) * STEP;
        if (p.g) p.vy += p.g * STEP;
        if (p.sway) p.x += Math.sin(p.age * p.sway + p.ph) * 0.6;
        return p.age < p.life && p.y < H + 6;
      });
    }
    function draw() {
      if (!cv) return;
      setup();
      ctx.clearRect(0, 0, W, H);
      parts.forEach(p => {
        if (p.age < 0) return;
        if (p.k === 'leaf') spr(ctx, LEAF[Math.floor(p.age * 3) % 2], p.x, p.y, LEAF_PAL);
        else if (p.k === 'drop') { ctx.fillStyle = '#7FA7D6'; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 2); }
        else dot(ctx, p.x, p.y, p.c, p.s);
      });
      if (flagEl) {
        const r = flagEl.getBoundingClientRect();
        if (r.bottom > 0 && r.top < innerHeight) spr(ctx, FLAG, (r.left + r.width * 0.86) / s + 2, r.top / s - 10, FLAG_PAL);
      }
      if (mon) {
        const sp = monSprite(mon.face, mon.body, false);
        spr(ctx, sp, mon.x, mon.y, PAL);
        if (mon.prop === 'flag') spr(ctx, FLAG, mon.x + 13, mon.y - 4, FLAG_PAL);
        bubble.style.left = ((mon.x + 17) * s) + 'px';
        bubble.style.top = ((mon.y + 4) * s) + 'px';
      }
      if (bubbleEnd && performance.now() > bubbleEnd) { bubble.classList.remove('on'); bubbleEnd = 0; }
    }
    return {
      update, draw,
      show(face, body) { mon = { x: 0, y: 0, face, body }; },
      set(x, y, face, prop) { if (mon) Object.assign(mon, { x, y, face: face || mon.face, prop }); },
      hide() { mon = null; bubble && bubble.classList.remove('on'); },
      attach(scale) { setup(scale); },
      say(text, sec) { bubble.textContent = text; bubble.classList.add('on'); bubbleEnd = performance.now() + (sec || 2) * 1000; },
      confetti() {
        const cols = [cssVar('--up', '#E5484D'), '#FFC94A', '#FF8FA3', '#3CCBAA', '#8B7CF6'];
        for (let i = 0; i < 150; i++) parts.push({ x: rnd(0, W), y: rnd(-H * 0.6, -2), vy: rnd(14, 26), c: pick(cols), s: Math.random() < 0.3 ? 2 : 1, sway: rnd(2, 4), ph: rnd(0, 6), life: 5.5 });
      },
      firework(x, y) {
        const c = pick([cssVar('--up', '#E5484D'), '#FFC94A', '#FF8FA3', '#3CCBAA', '#8B7CF6']);
        for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; parts.push({ x, y, vx: Math.cos(a) * 20, vy: Math.sin(a) * 20, g: 16, c, life: 1 }); }
      },
      leaves() { for (let i = 0; i < 18; i++) parts.push({ k: 'leaf', x: rnd(-10, W), y: rnd(-H * 0.5, -6), vx: rnd(4, 9), vy: rnd(8, 14), sway: rnd(1.5, 3), ph: rnd(0, 6), life: 7 }); },
      drip(x, y) { parts.push({ k: 'drop', x, y, vy: rnd(30, 45), life: rnd(0.6, 1.1) }); },
      puddle(el) {
        if (!el) return;
        const p = document.createElement('i');
        p.className = 'gw-puddle';
        p.style.left = rnd(8, 70) + '%';
        p.style.top = rnd(10, 60) + '%';
        el.appendChild(p);
        setTimeout(() => p.remove(), 25000);
      },
      plantFlag(el) { flagEl = el; },
      clearFlag() { flagEl = null; },
      /** 離開總覽時清掉畫面上殘留的東西 */
      clear() { mon = null; parts = []; flagEl = null; if (bubble) bubble.classList.remove('on'); if (ctx) ctx.clearRect(0, 0, W, H); },
    };
  }

  /** 把舞台和頁面層接起來（頁面層整個 App 共用一個） */
  let sharedPage = null;
  function mount(canvas, opts) {
    const page = sharedPage || (sharedPage = PageLayer());
    const stage = Stage(canvas, Object.assign({}, opts, { page }));
    const attach = () => page.attach(canvas.getBoundingClientRect().width / stage.state.W);
    const origStart = stage.start, origSeek = stage.seek;
    stage.start = () => { origStart(); attach(); };
    stage.seek = (n, t) => { stage.resize(); attach(); origSeek(n, t); };
    const onResize = () => { stage.resize(); attach(); };
    addEventListener('resize', onResize);
    const origStop = stage.stop;
    stage.stop = () => { origStop(); removeEventListener('resize', onResize); };
    stage.page = page;
    return stage;
  }

  // ═════════ 各頁用的小股娃娃（靜態圖） ═════════
  const ACC = {
    hat: { rows: ['...y...', '..yry..', '..ryr..', '.yryry.', 'ryryryr'], pal: { y: '#FFC94A', r: '#FF5C7A' }, x: 8, y: 5 },
    glasses: { rows: ['oooo..oooo', 'o..oooo..o', 'oooo..oooo'], pal: { o: '#1B1E3C' }, x: 6, y: 12 },
    wrench: { rows: ['.ss.', '.s.s', '.ss.', 's...', 's...'], pal: { s: '#8A8FA8' }, x: 18, y: 13 },
    question: { rows: ['.oo.', 'o..o', '...o', '..o.', '....', '..o.'], pal: { o: '#1B1E3C' }, x: 18, y: 2 },
    coin: { rows: COIN[0], pal: COIN_PAL, x: 16, y: 13 },
    sweat: { rows: ['.t', 'tt', 'tt'], pal: { t: '#6FB7FF' }, x: 17, y: 9 },
    news: { rows: ['oooooo', 'owwwwo', 'okkkko', 'owwwwo', 'okkwko', 'oooooo'], pal: { o: '#1B1E3C', w: '#FFFFFF', k: '#8A8FA8' }, x: 16, y: 13 },
  };
  const miniCache = {};
  /** opts: { face, body, acc, walk } → 圖片網址（22×21 像素，畫面上用 CSS 放大） */
  function miniURL(o) {
    o = o || {};
    const key = [o.face, o.body, o.acc, o.walk].join('|');
    if (miniCache[key]) return miniCache[key];
    const c = document.createElement('canvas');
    c.width = 22; c.height = 21;
    const x = c.getContext('2d');
    const sp = monSprite(o.face || 'idle', o.body || 'normal', !!o.walk);
    spr(x, sp, 3 + Math.round((16 - sp[0].length) / 2), 21 - sp.length, PAL);
    const a = ACC[o.acc];
    if (a) spr(x, a.rows, a.x, a.y, a.pal);
    return (miniCache[key] = c.toDataURL());
  }

  return { NAME, mount, computeState, achievements, miniURL, LEVELS, FLAG_COLORS, monSprite, spr, PAL };
})();

// ═════════ 8-bit 音效與背景音樂（Web Audio 即時合成，不用音檔）═════════
// iPhone 規定要等使用者第一次點畫面才能出聲；靜音鍵打開時不會出聲（ambient）。
const SFX = (() => {
  let ac = null, master, sfxBus, musBus, unlocked = false;
  const on = { sfx: true, music: true };
  const last = {};
  const GAP = { step: 0.12, coin: 0.06, boom: 0.15, talk: 0.25, thunder: 0.8 };

  const hz = n => {
    const m = /^([A-G])(#|b)?(\d)$/.exec(n);
    const k = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (k + (+m[3] + 1) * 12 - 69) / 12);
  };

  function ensure() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
    musBus = ac.createGain(); musBus.gain.value = 0.22; musBus.connect(master);
    return ac;
  }

  // 紅白機的方波有 12.5%／25%／50% 三種寬度，音色不同
  const waves = {};
  function pulse(duty) {
    if (waves[duty]) return waves[duty];
    const n = 32, re = new Float32Array(n), im = new Float32Array(n);
    for (let i = 1; i < n; i++) im[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty);
    return (waves[duty] = ac.createPeriodicWave(re, im));
  }

  /** 單音：f 可以是頻率或音名；o.to 滑音、o.vib 顫音 */
  function tone(f, t, dur, o) {
    o = o || {};
    const osc = ac.createOscillator(), g = ac.createGain();
    const f0 = typeof f === 'string' ? hz(f) : f;
    if (o.type === 'triangle' || o.type === 'sine') osc.type = o.type; else osc.setPeriodicWave(pulse(o.duty || 0.25));
    osc.frequency.setValueAtTime(f0, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(typeof o.to === 'string' ? hz(o.to) : o.to, t + dur);
    if (o.vib) {
      const lfo = ac.createOscillator(), lg = ac.createGain();

      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + dur);
    }
    const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.005);
    g.gain.setValueAtTime(v, t + Math.max(0.005, dur * (o.hold == null ? 0.6 : o.hold)));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }

  function noise(t, dur, o) {
    o = o || {};

      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();

    flt.frequency.setValueAtTime(o.f || 4000, t);
    if (o.fTo) flt.frequency.exponentialRampToValueAtTime(o.fTo, t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(o.bus || sfxBus);
    src.start(t); src.stop(t + dur + 0.02);

  const SOUNDS = {

    click: t => tone(880, t, 0.04, { duty: 0.5, vol: 0.12 }),

    coinDrop: t => tone(1400, t, 0.12, { to: 700, duty: 0.5, vol: 0.15 }),

    chomp: t => { for (let i = 0; i < 3; i++) { tone(220 - i * 20, t + i * 0.13, 0.06, { duty: 0.5, vol: 0.18 }); noise(t + i * 0.13, 0.04, { f: 1200, vol: 0.08 }); } },
    flagUp: t => run(t, ['C5', 'G5', 'C6'], 0.08, { duty: 0.25, vol: 0.2 }),
    flag: t => { run(t, ['C6', 'E6', 'G6'], 0.07, { duty: 0.25, vol: 0.2 }); tone('C7', t + 0.21, 0.45, { duty: 0.125, vol: 0.18, hold: 0.3 }); noise(t + 0.21, 0.1, { filter: 'highpass', f: 5000, vol: 0.08 }); },
    reunion: t => run(t, ['G5', 'A5', 'B5', 'D6', 'G6'], 0.08, { duty: 0.25, vol: 0.2 }),
    menu: t => { tone('E6', t, 0.05, { duty: 0.5, vol: 0.15 }); tone('B5', t + 0.06, 0.08, { duty: 0.5, vol: 0.15 }); },
    ding: t => tone('E6', t, 0.35, { type: 'triangle', vol: 0.3, hold: 0.1 }),
    ok: t => { tone('C6', t, 0.06, { duty: 0.5, vol: 0.12 }); tone('G6', t + 0.06, 0.1, { duty: 0.5, vol: 0.12 }); },
    err: t => { tone(220, t, 0.12, { duty: 0.5, vol: 0.15 }); tone(165, t + 0.13, 0.18, { duty: 0.5, vol: 0.15 }); },
    dizzy: t => tone(700, t, 1.1, { to: 350, duty: 0.25, vol: 0.15, vib: 9 }),

  function play(name) {
    if (!on.sfx || !ac || ac.state !== 'running' || !SOUNDS[name]) return;
    const t = ac.currentTime;
    if (last[name] && t - last[name] < (GAP[name] || 0.04)) return;
    last[name] = t;
    SOUNDS[name](t + 0.01);
  }

  // ── 背景音樂：依今天漲跌換曲（漲：輕快 C 大調／平：悠閒 F 大調／跌：慢板 A 小調）──
  // 每首 4 小節、每小節 8 個八分音符；'_' 表示延長上一個音、'-' 表示休止
  const SONGS = {
    up: { bpm: 140, duty: 0.25, hat: [0, 2, 4, 6], bassEvery: 1,
      lead: 'E5 G5 C6 _ G5 E5 G5 _ | D5 G5 B5 _ A5 G5 D5 _ | C5 E5 A5 _ G5 E5 C5 E5 | F5 A5 C6 A5 G5 _ _ _',
      bass: ['C3', 'G2', 'A2', 'F2'] },
    flat: { bpm: 100, duty: 0.125, hat: [0, 4], bassEvery: 2,
      lead: 'A4 _ C5 _ F5 _ C5 _ | G4 _ C5 _ E5 _ C5 _ | A4 _ D5 _ F5 _ D5 _ | Bb4 _ D5 _ F5 _ E5 _',
      bass: ['F2', 'C3', 'D3', 'Bb2'] },
    down: { bpm: 84, duty: 0.125, hat: [], bassEvery: 4,
      lead: 'A4 _ C5 _ E5 _ _ - | D5 _ F5 _ A4 _ _ - | B4 _ G#4 _ E4 _ _ - | A4 _ E4 _ A4 _ _ -',
      bass: ['A2', 'D3', 'E2', 'A2'] },
  };
  let mood = 'flat', want = 'flat', timer = 0, step = 0, nextT = 0;

  function parse(song) {
    if (song.steps) return song.steps;
    const tok = song.lead.replace(/\|/g, ' ').trim().split(/\s+/);
    return (song.steps = tok.map((n, i) => {
      if (n === '_' || n === '-') return null;
      let len = 1;
      while (tok[i + len] === '_') len++;
      return { n, len };
    }));
  }
  function schedule() {
    while (nextT < ac.currentTime + 0.3) {
      if (step === 0 && want !== mood) mood = want;
      const song = SONGS[mood], e = 60 / song.bpm / 2, steps = parse(song);
      const s = steps[step], bar = Math.floor(step / 8), inBar = step % 8;
      if (s) tone(s.n, nextT, e * s.len * 0.95, { duty: song.duty, vol: 0.22, hold: 0.7, bus: musBus });
      if (inBar % song.bassEvery === 0) {
        const root = song.bass[bar], oct = song.bassEvery === 1 && inBar % 2 ? root.replace(/\d/, d => +d + 1) : root;
        tone(oct, nextT, e * song.bassEvery * 0.9, { type: 'triangle', vol: 0.35, hold: 0.8, bus: musBus });
      }
      if (song.hat.indexOf(inBar) >= 0) noise(nextT, 0.03, { filter: 'highpass', f: 7000, vol: inBar === 0 ? 0.07 : 0.04, bus: musBus });
      nextT += e;
      step = (step + 1) % steps.length;
    }
  }
  function startMusic() {
    if (timer || !on.music || !unlocked) return;
    musBus.gain.cancelScheduledValues(ac.currentTime);
    musBus.gain.setValueAtTime(0.22, ac.currentTime);
    step = 0; mood = want; nextT = ac.currentTime + 0.1;
    timer = setInterval(schedule, 80);
    schedule();
  }
  function stopMusic() {
    if (!timer) return;
    clearInterval(timer); timer = 0;
    musBus.gain.setValueAtTime(musBus.gain.value, ac.currentTime);
    musBus.gain.linearRampToValueAtTime(0, ac.currentTime + 0.2);
  }

  /** 第一次點畫面時呼叫（iPhone 一定要在點擊當下才能開聲音） */
  function unlock() {
    if (!ensure()) return;
    if (ac.state !== 'running') ac.resume();
    if (!unlocked) {
      unlocked = true;
      // 播一個無聲的音，iOS 才會真正打開音訊
      const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
      startMusic();
    }
  }

  return {
    unlock, play,
    get unlocked() { return unlocked; },
    /** {sfx, music}：開關音效與音樂 */
    set(o) {
      Object.assign(on, o);
      if (!ac) return;
      if (on.music) startMusic(); else stopMusic();
    },
    /** 今天的漲跌（小數）→ 換對應的曲子，在下一輪開頭切換 */
    setMood(p) { want = p > 0.0005 ? 'up' : p < -0.005 ? 'down' : 'flat'; },
    pause() { if (ac && ac.state === 'running') ac.suspend(); },
    resume() { if (ac && unlocked) ac.resume(); },
  };
})();

/** 算式輸入：支援 2782+1500、1,234×2 這類寫法 */
function evalExpr(raw) {
  const s = String(raw).replace(/[,，\s]/g, '').replace(/[＋]/g, '+').replace(/[－−]/g, '-').replace(/[×xX＊]/g, '*').replace(/[÷／]/g, '/').replace(/[（]/g, '(').replace(/[）]/g, ')');
  if (s === '') return null;
  let i = 0;
  const peek = () => s[i];
  function num() {
    if (peek() === '(') { i++; const v = add(); if (s[i++] !== ')') throw 0; return v; }
    if (peek() === '-') { i++; return -num(); }
    const m = s.slice(i).match(/^\d+(\.\d+)?/);
    if (!m) throw 0;
    i += m[0].length;
    return parseFloat(m[0]);
  }
  function mul() { let v = num(); while (peek() === '*' || peek() === '/') { const o = s[i++]; const r = num(); v = o === '*' ? v * r : v / r; } return v; }
  function add() { let v = mul(); while (peek() === '+' || peek() === '-') { const o = s[i++]; const r = mul(); v = o === '+' ? v + r : v - r; } return v; }
  try { const v = add(); if (i !== s.length || !isFinite(v)) return NaN; return Math.round(v * 100) / 100; } catch (e) { return NaN; }
}

function apiKey() {

async function api(fn, ...args) {
