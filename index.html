function derive(d) {
  const acc = {};
  d.accounts.forEach(a => { acc[a.id] = a; });
  const isInv = id => acc[id] && d.investTypes.indexOf(acc[id].type) >= 0;
  const recs = d.records.map(r => {
    let total = 0, inv = 0, cost = 0, covered = 0, hasCost = false;
    const byType = {};
    Object.keys(r.entries).forEach(id => {
      const e = r.entries[id];
      const t = acc[id] ? acc[id].type : '銀行存款';
      total += e.a;
      byType[t] = (byType[t] || 0) + e.a;
      if (isInv(id)) {
        inv += e.a;
        if (e.c != null) { cost += e.c; covered += e.a; hasCost = true; }
      }
    });
    const auto = hasCost ? covered - cost : null;
    return Object.assign({}, r, { total, inv, cost: hasCost ? cost : null, covered, auto, profitShown: auto != null ? auto : r.profit, byType });
  });
  recs.forEach((r, i) => { r.prev = recs[i - 1] || null; r.delta = r.prev ? r.total - r.prev.total : null; });
  const typeColor = {};
  d.types.forEach((t, i) => { typeColor[t] = 'var(--t' + (i + 1) + ')'; });
  const authors = new Set(recs.map(r => r.by).filter(Boolean));
  const px = adjustSplits(d.prices || {});
  const D = { acc, isInv, recs, latest: recs[recs.length - 1] || null, typeColor, multiUser: authors.size > 1, px, mk: computeMarket(d, recs, px, S.live && S.live.quotes) };
  return Object.assign(D, buildHistory(D));
}

/** 每日資產序列（兩次記帳之間用收盤價推算）、連漲連跌、歷史最高、每段記帳區間存了多少 */
function buildHistory(D) {
  const recs = D.recs, px = D.px;
  const codeOf = id => D.acc[id] && D.acc[id].code;
  const units = recs.map(r => {
    const u = {};
    Object.keys(r.entries).forEach(id => {
      const c = codeOf(id), e = r.entries[id], p = c && px[c] ? priceIn(px[c], r.date) : null;
      u[id] = p && e.a ? e.a / p.p : null;
    });
    return u;
  });
  const dateSet = {};
  Object.keys(px).forEach(c => px[c].d.forEach(x => { dateSet[x] = 1; }));
  const first = recs.length ? recs[0].date : '9999';
  const tradeDays = Object.keys(dateSet).filter(x => x >= first).sort();
  const daily = [];
  let ri = -1, lastRi = -1, prevDay = null;
  tradeDays.forEach(day => {
    while (ri + 1 < recs.length && recs[ri + 1].date <= day) ri++;
    if (ri < 0) return;
    let total = 0, mkt = 0;
    Object.keys(recs[ri].entries).forEach(id => {
      const u = units[ri][id], c = codeOf(id);
      total += u == null ? recs[ri].entries[id].a : u * priceIn(px[c], day).p;
    });
    if (prevDay && lastRi >= 0) Object.keys(recs[lastRi].entries).forEach(id => {
      const u = units[lastRi][id], c = codeOf(id);
      if (u == null) return;
      const p1 = priceIn(px[c], day), p0 = priceIn(px[c], prevDay);
      if (p1 && p0) mkt += u * (p1.p - p0.p);
    });
    daily.push({ d: day, total, mkt });
    lastRi = ri; prevDay = day;
  });
  let streak = 0;
  for (let i = daily.length - 1; i >= 1; i--) {
    const m = daily[i].mkt;
    if (Math.abs(m) < 1) break;
    if (streak === 0 || Math.sign(streak) === Math.sign(m)) streak += Math.sign(m); else break;
  }
  const points = recs.map(r => ({ date: r.date, total: r.total, profit: r.profitShown }))
    .concat(daily.map(x => ({ date: x.d, total: x.total })))
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  let ath = 0;
  points.forEach(p => { if (p.total > ath) ath = p.total; });
  const last = daily[daily.length - 1];
  const before = last ? points.filter(p => p.date < last.d).reduce((m, p) => Math.max(m, p.total), 0) : 0;
  const newHigh = !!last && D.mk.ok && last.d === D.mk.date && last.total > before;
  const saved = [];
  for (let i = 1; i < recs.length; i++) {
    const r0 = recs[i - 1], r1 = recs[i];
    let market = 0, ok = true;
    Object.keys(r0.entries).forEach(id => {
      const a = D.acc[id], e = r0.entries[id];
      if (!a || !D.isInv(id) || !e.a) return;
      const p0 = a.code && px[a.code] ? priceIn(px[a.code], r0.date) : null, p1 = a.code && px[a.code] ? priceIn(px[a.code], r1.date) : null;
      if (!p0 || !p1) { ok = false; return; }
      market += e.a / p0.p * (p1.p - p0.p);
    });
    if (ok) saved.push({ date: r1.date, from: r0.date, delta: r1.total - r0.total, market, saved: r1.total - r0.total - market });
  }
  return { daily, streak, ath, newHigh, points, saved };
}

// ═════════ 股價估算 ═════════
/** 某代號在某日（含）之前最後一個價格；早於資料起點 7 天內就用第一筆 */
function priceIn(s, date) {
  if (!s || !s.d.length) return null;
  let lo = 0, hi = s.d.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (s.d[m] <= date) { ans = m; lo = m + 1; } else hi = m - 1; }
  if (ans < 0) return days(date, s.d[0]) <= 7 ? { d: s.d[0], p: s.p[0] } : null;
  return { d: s.d[ans], p: s.p[ans] };
}
function priceAt(code, date) { return priceIn(S.D.px[code], date); }

/**
 * 證交所給的是原始價格，股票分割那天價格會突然變成 1/4 之類（例如 0050 在 2025/6 一拆四）。
 * 偵測單日變成整數倍的跳動，把分割前的價格換算成分割後的基準。
 */
function adjustSplits(prices) {
  const out = {};
  Object.keys(prices).forEach(code => {
    const s = prices[code], p = s.p.slice();
    let k = 1;
    for (let i = p.length - 1; i > 0; i--) {
      const r = s.p[i - 1] / s.p[i];
      const f = Math.round(r >= 1 ? r : 1 / r);
      if (f >= 2 && Math.abs((r >= 1 ? r : 1 / r) - f) / f < 0.12) k *= r >= 1 ? f : 1 / f;
      p[i - 1] = s.p[i - 1] / k;
    }
    out[code] = { d: s.d, p: p };
  });
  return out;
}

/** 用最近一次記帳的金額 ÷ 當天收盤價推算持有單位，再乘上最新價格 */
function computeMarket(d, recs, prices, live) {
  const holdings = [];
  let est = 0, change = 0, date = '';
  d.accounts.forEach(a => {
    if (a.status !== '使用中') return;
    let i = recs.length - 1;
    while (i >= 0 && !recs[i].entries[a.id]) i--;
    if (i < 0) return;
    const rec = recs[i], e = rec.entries[a.id];
    const s = a.code && prices[a.code];
    const base = s && s.d.length >= 2 ? priceIn(s, rec.date) : null;
    if (!base || !e.a) { est += e.a; return; }
    const n = s.d.length;
    let last = { d: s.d[n - 1], p: s.p[n - 1] }, prev = { d: s.d[n - 2], p: s.p[n - 2] };
    // 盤中即時：證交所報價比最後一筆收盤新，就用它（昨收當比較基準）
    const q = live && live[a.code];
    if (q && q.d > last.d) { prev = { d: last.d, p: q.y }; last = { d: q.d, p: q.p, live: true, t: q.t }; }
    const units = e.a / base.p;
    const value = last.d > rec.date ? units * last.p : e.a;
    const c = units * (last.p - prev.p);
    holdings.push({ acc: a, units, last, prev, value, change: c, pct: last.p / prev.p - 1, recDate: rec.date });
    est += value;
    change += c;
    if (last.d > date) date = last.d;
  });
  const lives = holdings.filter(h => h.last.live);
  // 基金淨值晚一天公布：最新價格不是最近交易日的，不算進「今天」，避免把前一天的漲跌混進來
  holdings.forEach(h => { if (h.last.d < date) h.pending = true; });
  change = holdings.filter(h => !h.pending).reduce((t, h) => t + h.change, 0);
  return { holdings, est, change, pct: holdings.length ? change / (est - change) : 0, date, ok: holdings.length > 0, newer: holdings.some(h => h.last.d > h.recDate),
    live: lives.length > 0, liveAt: lives.length ? lives.map(h => h.last.t).sort().pop() : '' };
}

const THINGS = [['杯珍奶', 60], ['個便當', 110], ['張電影票', 330], ['頓火鍋', 800], ['趟高鐵台北↔高雄來回', 2980], ['副 AirPods', 7490], ['張台北↔東京來回機票', 15000], ['支 iPhone', 36900]];
function equiv(n) {
  const a = Math.abs(n);
  if (a < 60) return null;
  let pick = THINGS[0];
  THINGS.forEach(t => { if (a >= t[1]) pick = t; });
  const k = a / pick[1];
  return (k < 10 ? String(Math.round(k * 10) / 10) : String(Math.round(k))) + ' ' + pick[0];
}
const MOODS = {
  up: [['小漲，穩穩的。', '今天有一點點甜。'], ['市場今天很給面子！', '今天的你比昨天更有錢。'], ['大漲日！今天可以加個菜 🎉', '恭喜！這種日子值得記住。']],

function moodLevel(p) { const a = Math.abs(p); return a < 0.005 ? 0 : a < 0.015 ? 1 : 2; }
function moodMsg(mk) {

  const list = MOODS[mk.change > 0 ? 'up' : 'down'][moodLevel(mk.pct)];

}

/** 某帳戶在某筆紀錄（含）之前最後一次的金額與成本 */
function lastKnown(id, beforeIdx) {
  const recs = S.D.recs;
  let a = null, c = null;
  for (let i = beforeIdx; i >= 0; i--) {
    const e = recs[i].entries[id];
    if (!e) continue;
    if (a === null) a = e.a;
    if (c === null && e.c != null) c = e.c;
    if (a !== null && c !== null) break;
  }
  return { a, c };
}

function inRange(recs) {
  if (!recs.length || S.range === 'all') return recs;
  const last = recs[recs.length - 1].date;
  const from = S.range === 'ytd' ? last.slice(0, 4) + '-01-01' : (+last.slice(0, 4) - 1) + last.slice(4);
  // 往前多帶一筆當起點，線才會從區間開頭接起來
  const i = recs.findIndex(r => r.date >= from);
  return recs.slice(Math.max(0, i - (S.range === 'ytd' ? 1 : 0)));
}

function goalInfo() {
  const { recs, latest } = S.D;
  const year = (latest ? latest.date : S.data.today).slice(0, 4);
  const goal = S.data.goals[year] || null;
  const thisYear = recs.filter(r => r.date.slice(0, 4) === year);
  const prevYear = recs.filter(r => r.date.slice(0, 4) < year);
  const base = prevYear.length ? prevYear[prevYear.length - 1] : thisYear[0];
  const cur = thisYear[thisYear.length - 1] || null;
  let proj = null;
  if (base && cur && days(base.date, cur.date) >= 30) {
    const rate = (cur.total - base.total) / days(base.date, cur.date);
    proj = cur.total + rate * Math.max(0, days(cur.date, year + '-12-31'));
  }
  const mk = S.D.mk;
  const now = mk.ok && mk.newer && mk.date.slice(0, 4) === year ? mk.est : (cur ? cur.total : 0);
  return { year, goal, challenge: (S.data.challenges || {})[year] || null, cur, base, proj, now, ytd: base && cur ? now - base.total : null };
}

function mountEntry() {
  const D = S.D;
  const editing = S.edit ? D.recs.find(r => r.id === S.edit) : null;
  const prevTotal = editing ? (editing.prev ? editing.prev.total : null) : (D.latest ? D.latest.total : null);
  $('#peek-img').src = GUGU.miniURL({ face: 'happy', acc: 'coin', body: S.pet.body });
  let first = true;
  function update() {
    let total = 0, bad = false;
    $$('.frow').forEach(row => {
      const inp = $('.amt', row);
      const v = evalExpr(inp.value);
      inp.classList.toggle('err', v !== null && isNaN(v));
      const c = $('.cost', row);
      if (c) c.classList.toggle('err', evalExpr(c.value) !== null && isNaN(evalExpr(c.value)));
      if (v !== null && isNaN(v)) bad = true;
      if (v) total += v;
      const last = row.dataset.last === '' ? null : Number(row.dataset.last);
      const d = v != null && !isNaN(v) && last != null ? v - last : null;
      const el = $('.diff', row);
      el.className = 'diff num ' + (d ? dir(d) : '');
      el.textContent = d ? signed(d) : '';
    });
    $('#f-total').textContent = bad ? '有欄位格式不對' : money(total);
    if (!first) {
      const d = total - (prevTotal || 0);
      const [face, acc, msg] = bad ? ['worry', 'question', '這格好像怪怪的？'] : prevTotal == null ? ['happy', 'coin', '第一筆！'] :
        d > 0 ? ['happy', 'coin', '比上次多 ' + wan(d) + '！'] : d < 0 ? ['worry', 'sweat', '比上次少 ' + wan(-d) + '…沒關係'] : ['idle', null, '跟上次一樣'];
      $('#peek-say').textContent = msg;
      $('#peek-img').src = GUGU.miniURL({ face, acc, body: S.pet.body });
    }
    first = false;
    $('#f-delta').innerHTML = !bad && prevTotal != null ? '<span class="' + dir(total - prevTotal) + '">' + arrow(total - prevTotal) + ' ' + signed(total - prevTotal) + '</span> <span class="muted">較上次</span>' : '';
    return !bad;
  }
  $$('.frow input').forEach(inp => {
    inp.addEventListener('input', update);
    inp.addEventListener('focus', () => { inp.value = inp.value.replace(/,/g, ''); setTimeout(() => inp.select(), 0); });
    inp.addEventListener('blur', () => { const v = evalExpr(inp.value); if (v !== null && !isNaN(v)) inp.value = nf.format(v); update(); });
  });
  update();
  const sc = $('#show-closed');
  if (sc) sc.onclick = () => { S.showClosed = true; const keep = collect(); render(); restore(keep); };
  const cancel = $('#f-cancel');
  if (cancel) cancel.onclick = () => go('records');
  $('#f-save').onclick = async () => {
    if (!update()) { toast('有欄位格式不對，請檢查紅框'); return; }
    const entries = [];
    $$('.frow').forEach(row => {
      const a = evalExpr($('.amt', row).value);
      if (a === null) return;
      const c = $('.cost', row) ? evalExpr($('.cost', row).value) : null;
      entries.push({ id: row.dataset.id, a: a, c: c });
    });
    if (!entries.length) { toast('至少要填一個帳戶'); return; }
    const date = $('#f-date').value;
    if (!date) { toast('請選擇日期'); return; }
    const ok = await call('saveRecord', [{ id: editing ? editing.id : null, date: date, note: $('#f-note').value.trim(), entries: entries }], editing ? '已更新' : '已儲存 ✓');
    if (ok) { S.pendingEat = true; go(editing ? 'records' : 'home'); }
  };
  function collect() {
    const m = {};
    $$('.frow').forEach(row => { m[row.dataset.id] = [$('.amt', row).value, $('.cost', row) ? $('.cost', row).value : null]; });
    return { m, date: $('#f-date').value, note: $('#f-note').value };
  }
  function restore(k) {
    $$('.frow').forEach(row => { const v = k.m[row.dataset.id]; if (!v) return; $('.amt', row).value = v[0]; if (v[1] != null && $('.cost', row)) $('.cost', row).value = v[1]; });
    $('#f-date').value = k.date; $('#f-note').value = k.note;
    $$('.frow input').forEach(i => i.dispatchEvent(new Event('input')));
  }
}

const EXPLAIN = {"predict": ["存錢冒險", "每個目標都是一關。電腦模擬兩千種股市可能的走法，把你現在的持股、每月存款、年終和預計的大額支出都算進去，數一數有幾種走法能在期限前過關，就是「過關機率」。星星越多代表越難。「道具」是你能自己控制的事，例如每月多存一點；「大魔王」是像 2022、2008 年那樣的大跌，會讓資產少多少。正二是兩倍槓桿，漲跌都比較兇，模擬裡都有算進去。這不是預言，是讓你知道哪些目標穩、哪些要拚。"], "stack": ["資產結構變化", "把你的錢分成銀行存款、股票ETF、基金、現金、外幣，疊在一起看。看每種顏色的厚度怎麼變，就知道錢慢慢從哪裡移到哪裡。例如存款那層變薄、股票那層變厚，代表你把更多錢放進了投資。"], "delta": ["每次記帳的增減", "每一根柱子是「這次記帳比上次多了或少了多少」。往上是增加、往下是減少，顏色照你設定的漲跌色。柱子特別長的那幾次，通常是發薪、大筆花費，或股市大漲大跌。"], "profit": ["投資獲利走勢", "你的投資總共幫你賺了多少錢。前半段是你以前手寫在備註裡的「獲利總額」；之後只要記帳時填上投入成本，就會改由 App 自動計算。線往上走，代表投資在幫你賺錢。"], "source": ["資產增加從哪來", "把每年資產增加的錢拆成兩塊：「投資賺的」是股價、淨值上漲多出來的錢；「自己存的」是扣掉市場漲跌之後剩下的部分，也就是薪水存下來、再扣掉花費的結果。兩塊都是正的，代表你又會存又會投資。"], "invest": ["投資明細", "每一檔投資現在值多少、你總共投入多少錢（投入成本）、賺賠多少，以及報酬率。報酬率 50% 的意思是：每投入 100 元，現在值 150 元。"], "year": ["年度總結", "每一年從年初到年底（今年就到最新一筆）資產增加了多少，以及當年的目標達成了幾成。"]};

/** 每段記帳區間：投資賺的 = 期初持有單位 × 價格變化；其餘就是自己存下（或花掉）的錢 */
function sourceByYear() {
  const out = {};
  S.D.saved.forEach(iv => {
    const y = iv.date.slice(0, 4);
    const o = out[y] || (out[y] = { year: y, delta: 0, market: 0, from: iv.from, to: iv.date });
    o.delta += iv.delta; o.market += iv.market; o.to = iv.date;
  });
  return Object.keys(out).sort().reverse().map(y => Object.assign(out[y], { saved: out[y].delta - out[y].market }));
}
function sourceCard() {
  const list = sourceByYear();
  if (!list.length) return '';
  const max = Math.max(...list.map(o => Math.max(Math.abs(o.market), Math.abs(o.saved))), 1);
  const bar = (v, color) => '<div class="cbar"><i style="background:' + color + ';width:' + (Math.abs(v) / max * 50) + '%;' + (v >= 0 ? 'left:50%' : 'right:50%') + '"></i></div>';
  const body = list.map(o => {
    const share = o.delta > 0 && o.market > 0 && o.saved > 0 ? '，其中 ' + pct(o.market / o.delta, 0) + ' 是投資賺的' : '';
    return '<div class="src-year"><div class="src-top"><b>' + o.year + '</b><span class="num ' + dir(o.delta) + '" style="font-weight:650">' + signed(o.delta) + '</span></div>' +
      '<p class="src-sum">' + fmtD(o.from) + ' → ' + fmtD(o.to) + ' 資產' + (o.delta >= 0 ? '增加 ' : '減少 ') + wan(Math.abs(o.delta)) + share + '。</p>' +
      '<div class="src-row"><span>投資賺的</span>' + bar(o.market, 'var(--t3)') + '<span class="amt num">' + signed(o.market) + '</span></div>' +
      '<div class="src-row"><span>' + (o.saved >= 0 ? '自己存的' : '花掉的') + '</span>' + bar(o.saved, 'var(--t1)') + '<span class="amt num">' + signed(o.saved) + '</span></div></div>';
  }).join('');
  return '<section class="card span2"><div class="card-h">' + icon('fund') + '<h2>資產增加從哪來</h2>' + explainBtn('source') + '</div>' + body +
    '<p class="muted" style="font-size:12px;margin:14px 0 0">「自己存的」是資產變化扣掉市場漲跌後剩下的部分，包含薪水、紅包，也扣掉了花費。富達全球主題機會基金以美元淨值推算，會有一點匯率誤差。</p></section>';
}

/** 代號 → 你看得懂的名稱（帳戶名稱或指標名稱） */
function codeName(code) {
  const a = S.data.accounts.find(x => x.code === code);
  return a ? a.name : IND_META[code] ? IND_META[code].name : code;
}
/**
 * 資料健康：自動更新有沒有在跑、哪些價格落後。
 * 落後是跟其他持股的最新日期比，不是跟日曆比，所以遇到連假不會誤報。
 */
function dataHealth() {
  const st = S.data.priceStatus, out = [];
  if (!st) return out;
  const hrs = (Date.now() - Date.parse(st.at.replace(' ', 'T') + ':00+08:00')) / 3600e3;
  if (hrs > 26) out.push('股價自動更新已經 ' + Math.floor(hrs) + ' 小時沒有跑');
  const last = s => (s && s.d.length ? s.d[s.d.length - 1] : '');
  const held = S.data.accounts.filter(a => a.status === '使用中' && a.code).map(a => a.code);
  const stockDays = [...new Set(held.filter(c => !/:FO$/.test(c)).map(c => last(S.data.prices[c])).filter(Boolean))].sort();
  const newest = stockDays[stockDays.length - 1];
  if (!newest) return out;
  // 基金淨值本來就晚一天，所以基金容許落後一個交易日
  const tradeDays = [...new Set([].concat(...held.map(c => (S.data.prices[c] || { d: [] }).d)))].sort();
  const dayBefore = tradeDays[tradeDays.indexOf(newest) - 1] || newest;
  held.forEach(c => {
    const d = last(S.data.prices[c]);
    if (d && d < (/:FO$/.test(c) ? dayBefore : newest)) out.push(codeName(c) + ' 的價格停在 ' + shortD(d));
  });
  ['TAIEX', '2330', 'FOREIGN'].forEach(id => {
    const d = last((S.data.indicators || {})[id]);
    if (d && d < newest) out.push(codeName(id) + '（市場頁）停在 ' + shortD(d));
  });
  return out;
}
function healthCard() {
  const issues = dataHealth();
  if (!issues.length) return '';
  return '<button class="card health span2" id="health-btn">' + mini({ face: 'worry', acc: 'question' }) + '<span>' + esc(issues[0]) + (issues.length > 1 ? '，還有 ' + (issues.length - 1) + ' 項' : '') + '</span><span class="more">看原因</span></button>';
}
function openHealth() {
  const issues = dataHealth();
  openSheet('<div class="sheet-h">' + mini({ face: 'worry', acc: 'question' }) + '<h3>資料有狀況</h3><button class="icon-btn" data-close aria-label="關閉">' + icon('x', 'inv') + '</button></div>' +
    '<ul class="gw-log" style="margin:0 0 12px">' + issues.map(t => '<li><i style="background:#FFC94A"></i><span>' + esc(t) + '</span></li>').join('') + '</ul>' +
    '<p class="sub" style="margin:0 0 14px;line-height:1.75">股價是自動從證交所和 Yahoo 抓的公開資料，偶爾會失敗。失敗時 App 會先用最後一次抓到的價格，所以總資產和「今天」可能不是最新的。通常下一次自動更新（每天 8、15、21 點）就會補上；如果連續兩天都這樣，跟 Claude 說一聲。</p>' +
    priceStatusBody());
}
function priceStatusBody() {
  const st = S.data.priceStatus;
  // 把紀錄裡的代號換成名稱，「證交所失敗，改用 Yahoo」代表備援有在運作
  const pretty = l => l.replace(/^(指標 )?(\S+)/, (m, ind, code) => (ind || '') + codeName(code));
  return st ? '<p class="sub" style="margin:0 0 8px;font-size:14px">上次自動更新：' + esc(st.at) + '</p><div class="list">' + st.log.map(l => '<div class="row" style="padding:7px 4px;font-size:13px">' + esc(pretty(l)) + '</div>').join('') + '</div>' : '';
}
function priceStatusCard() {
  const st = S.data.priceStatus;
  const body = st
    ? priceStatusBody()
    : '<p class="sub" style="margin:0;font-size:14px">還沒開始自動更新。請在 Apps Script 編輯器選「Market.gs」，執行「setupDaily」一次。</p>';
  return '<section class="card"><div class="card-h">' + icon('refresh') + '<h2>股價自動更新</h2></div>' + body + '</section>';
}
function mountSettings() {
  $('#add-acc').onclick = () => accountForm(null);
  $$('[data-edit-acc]').forEach(b => b.onclick = () => accountForm(S.D.acc[b.dataset.editAcc]));
  $$('[data-mv]').forEach(b => b.onclick = () => {
    const [i, d] = b.dataset.mv.split(',').map(Number);
    const ids = S.data.accounts.map(a => a.id);
    [ids[i], ids[i + d]] = [ids[i + d], ids[i]];
    call('saveAccountOrder', [ids], '已調整順序');
  });
  $('#g-save').onclick = () => {
    const amt = evalExpr($('#g-amt').value);
    if (!amt || isNaN(amt)) { toast('請輸入目標金額'); return; }
    const ch = evalExpr($('#g-ch').value);
    if (ch !== null && (isNaN(ch) || ch <= amt)) { toast('挑戰目標要比年度目標高'); return; }
    const year = $('#g-year').value.trim();
    const cur = S.data.challenges && S.data.challenges[year];
    call('setGoal', [year, amt, $('#g-name').value.trim()], ch && !(cur && cur.amount === ch) ? null : '目標已更新').then(ok => {
      if (ok && ch && !(cur && cur.amount === ch)) call('setGoal', [year, ch, '挑戰目標'], '目標已更新');
    });
  };
  segBind('#s-updown', v => { S.updown = v; store.set('updown', v); applyPrefs(); render(); });
  segBind('#s-theme', v => { S.theme = v; store.set('theme', v); applyPrefs(); render(); });
  segBind('#s-hide', v => { S.hidden = v === '1'; store.set('hidden', S.hidden); render(); });
  segBind('#s-quiet', v => { S.quiet = v === '1'; store.set('quiet', S.quiet); render(); });
  segBind('#s-sfx', v => { S.sfxOn = v === '1'; store.set('sfx', S.sfxOn); SFX.set({ sfx: S.sfxOn }); render(); });
  segBind('#s-music', v => { S.musicOn = v === '1'; store.set('music', S.musicOn); SFX.set({ music: S.musicOn }); render(); });
  $('#gw-status-btn').onclick = openPetStatus;
}
function segBind(sel, fn) { $$(sel + ' button').forEach(b => b.onclick = () => fn(b.dataset.v)); }

function accountForm(a) {
  const opt = (list, cur) => list.map(x => '<option' + (x === cur ? ' selected' : '') + '>' + x + '</option>').join('');
  openSheet('<div class="sheet-h"><h3>' + (a ? '編輯帳戶' : '新增帳戶') + '</h3><button class="icon-btn" data-close aria-label="關閉">' + icon('x', 'inv') + '</button></div>' +
    '<label class="field"><span>名稱</span><input class="input" id="a-name" value="' + esc(a ? a.name : '') + '" placeholder="例如：台新活存、00919"></label>' +
    '<label class="field"><span>類型</span><select class="input" id="a-type">' + opt(S.data.types, a ? a.type : '銀行存款') + '</select></label>' +
    '<label class="field"><span>狀態</span><select class="input" id="a-status">' + opt(['使用中', '已結清'], a ? a.status : '使用中') + '</select></label>' +
    '<label class="field"><span>股價代號（選填）</span><input class="input" id="a-code" autocapitalize="characters" value="' + esc(a ? a.code || '' : '') + '" placeholder="例如 0050；基金填 Yahoo 基金代碼"></label>' +
    '<p class="muted" style="font-size:12px;margin:-4px 0 16px">基金和股票ETF 類型的帳戶，記帳時會多一格「投入成本」。填了股價代號，就會每天自動估算市值（只支援上市股票和 ETF；基金代碼在 Yahoo 股市基金頁的網址裡，例如 F0HKG05WWP:FO）。已結清的帳戶不會出現在記帳畫面，但歷史資料會保留。</p>' +
    '<button class="btn primary" id="a-save">儲存</button>');
  $('#a-save').onclick = async () => {
    const ok = await call('saveAccount', [{ id: a ? a.id : null, name: $('#a-name').value, type: $('#a-type').value, status: $('#a-status').value, code: $('#a-code').value }], '帳戶已儲存');
    if (ok) closeSheet();
  };
}

// ═════════ 浮層 ═════════
let sheetChart = null;
function openSheet(html) {
  if (sheetChart) { sheetChart.destroy(); sheetChart = null; }
  const s = $('#sheet');
  s.innerHTML = '<div class="grab"></div>' + html;
  s.scrollTop = 0;
  s.classList.add('on');
  $('#sheet-bg').classList.add('on');
  $$('[data-close]', s).forEach(b => b.onclick = closeSheet);
}
function closeSheet() {
  $('#sheet').classList.remove('on');
  $('#sheet-bg').classList.remove('on');
  if (sheetChart) { sheetChart.destroy(); sheetChart = null; }
}
function confirmBox(msg, okLabel) {
  return new Promise(res => {
    openSheet('<div class="sheet-h"><h3>確認</h3></div><p class="sub" style="margin:0 0 20px">' + esc(msg) + '</p><div class="btn-row"><button class="btn" id="cf-no">取消</button><button class="btn primary" id="cf-ok" style="background:var(--red)">' + esc(okLabel) + '</button></div>');
    $('#cf-no').onclick = () => { closeSheet(); res(false); };
    $('#cf-ok').onclick = () => { closeSheet(); res(true); };
  });
}

// ═════════ 股娃娃訪客：在其他頁面偶爾從右下角探頭 ═════════
const VISIT_LINES = {
  market: ['新聞每天早上 9:30 更新', '點指標卡可以看它跟你有什麼關係', '這裡只說發生什麼事，不叫你買賣喔'],
  records: ['這裡是你的記帳歷史', '點一筆可以看當時的明細', '每一年都好努力！'],
  analysis: ['看不懂圖表？點圖表旁邊戴眼鏡的我', '「資產增加從哪來」是我最喜歡的一張'],
  settings: ['想讓我安靜一點，可以在這裡設定', '帳戶填上股價代號，我就能每天幫你算'],
};
function scheduleVisitor() {
  setTimeout(() => {
    const lines = VISIT_LINES[S.view];
    if (lines && !S.quiet && S.data && !S.data.needsSetup && document.visibilityState === 'visible' && !$('#sheet').classList.contains('on')) {
      const v = $('#visitor');
      $('.gw-say', v).textContent = pickOne(lines);
      $('img', v).src = GUGU.miniURL({ face: 'happy', body: S.pet ? S.pet.body : 'normal' });
      v.classList.add('on'); SFX.play('talk');
      setTimeout(() => v.classList.remove('on'), 5000);
    }
    scheduleVisitor();
  }, 35000 + Math.random() * 25000);
}

// ═════════ 盤中即時：開盤時間每 20 秒抓一次 ═════════
const LIVE_MS = 20000;
function marketOpenNow() {
  const t = new Date(Date.now() + 8 * 3600e3), day = t.getUTCDay(), m = t.getUTCHours() * 60 + t.getUTCMinutes();
  return day >= 1 && day <= 5 && m >= 8 * 60 + 58 && m <= 13 * 60 + 33;
}
async function pollLive(force) {
  if (!S.data || S.data.needsSetup || S.liveBusy || document.visibilityState !== 'visible') return;
  if (!force && !marketOpenNow()) return;
  S.liveBusy = true;
  try { S.live = await api('getQuotes'); applyLive(); }
  catch (e) { /* 即時報價失敗不打擾使用者，下次再試 */ }
  finally {
    S.liveBusy = false;
    if (!S.liveTried) { S.liveTried = true; if (S.view === 'home' && GW.stage && S.fresh) autoplay(GW.stage); }
  }
}
/** 只更新數字，不整頁重畫（股娃娃的演出不會被打斷） */
function applyLive() {
  if (!S.D) return;
  S.D.mk = computeMarket(S.data, S.D.recs, S.D.px, S.live && S.live.quotes);
  if (S.view === 'home') {
    const h = $('#hero-live'), tb = $('#today-body');
    if (h && S.D.latest) h.outerHTML = heroInner(S.D.latest);
    if (tb) tb.innerHTML = todayBody();
    if (GW.stage) GW.stage.setToday(S.D.mk.ok ? S.D.mk.pct : 0);
    SFX.setMood(S.D.mk.ok ? S.D.mk.pct : 0);
  } else if (S.view === 'market' && !$('#sheet').classList.contains('on')) {
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
}

// ═════════ 啟動 ═════════
function applyPrefs() {
  const root = document.documentElement;
  if (S.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', S.theme);
  root.setAttribute('data-updown', S.updown);
}
async function load(showBusy) {
  if (showBusy) busy(true);
  try {
    const data = await api('getAppData');
    S.loadedAt = Date.now();
    S.fresh = true;
    setData(data, !showBusy);
    if (!S.visited && !data.needsSetup) { S.visited = true; api('touchCare', 'visit').then(c => { S.care = c; }).catch(() => {}); }
    if (!data.needsSetup) pollLive(true);
  }
  catch (e) { toast('讀取失敗：' + (e && e.message ? e.message : e)); }
  finally { busy(false); }
}
function init() {
  applyPrefs();
  paintIcons(document);
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#btn-eye').onclick = () => { S.hidden = !S.hidden; store.set('hidden', S.hidden); render(); };
  $('#btn-refresh').onclick = () => load(true);
  $('#sheet-bg').onclick = closeSheet;
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto' && S.data) render(); });
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  chartEvents();
  $('#brand-mon').src = GUGU.miniURL({ face: 'happy' });
  $('#busy-img').src = GUGU.miniURL({ face: 'happy', walk: true });
  $('#visitor img').onclick = () => { $('#visitor').classList.remove('on'); go('home'); };
  scheduleVisitor();
  scheduleChatter();
  SFX.set({ sfx: S.sfxOn, music: S.musicOn });
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, SFX.unlock, { capture: true, passive: true }));
  setInterval(() => pollLive(false), LIVE_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') { SFX.pause(); return; }
    SFX.resume();
    if (Date.now() - S.loadedAt > 5 * 60e3) load(false); else pollLive(true);
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!apiKey()) return keyGate();
  const cached = store.get('cache', null);
  if (cached && !cached.needsSetup) { S.data = cached; S.D = derive(cached); }
  render();
  load(false);
  if (location.hash && !standalone()) addToHomeHint();
}
const standalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

/** 沒有密碼時：貼上設定連結 */
function keyGate() {
  $('main').innerHTML = '<div class="card empty" style="margin-top:24px">' + mini({ face: 'worry', acc: 'question' }, 'bob') +
    '<p>股娃娃還不認識這台手機。<br>請貼上你的設定連結：</p>' +
    '<input id="key-in" class="input" style="width:100%;margin:8px 0" placeholder="https://jengjih.github.io/gugu/#k=…" autocomplete="off">' +
    '<button class="btn primary" id="key-ok">開始使用</button></div>';
  $('#key-ok').onclick = () => {
    const v = $('#key-in').value.trim(), m = v.match(/k=([\w-]+)/) || v.match(/^([\w-]{20,})$/);
    if (!m) return toast('請貼上完整的設定連結');
    store.set('key', m[1]);
    location.reload();
  };
}

/** 在 Safari 用設定連結打開時：提醒加到主畫面（網址要保留 #k=… 才帶得過去） */
function addToHomeHint() {
  openSheet('<div class="sheet-h">' + mini({ face: 'happy' }) + '<h3>把股娃娃放到主畫面</h3></div>' +
    '<ol style="line-height:1.9;padding-left:1.3em"><li>點 Safari 下方的「分享」按鈕（方框加向上箭頭）</li><li>往下滑，點「加入主畫面」</li><li>名稱確認是「股娃娃」，點「加入」</li></ol>' +
    '<p class="muted">之後從主畫面打開，就不會有 Safari 的網址列和按鈕了。這個網址裡有你的密碼，請不要分享給別人。</p>' +
    '<div class="btn-row"><button class="btn" data-close>知道了</button></div>');
}
init();
